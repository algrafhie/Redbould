<script>
/* =====================================================================
   REDBOUND CLOUD VAULT & GLOBAL LEADERBOARD -> SUPABASE (v2.1.6.8)
   Perbaikan menyeluruh:
   1. Menjembatani penuh variabel IIFE game utama melalui window.__rbBridge
      dan localStorage fallback sehingga mySess(), collectAuth(), vaultSnapshot(),
      dan rbHash() tidak pernah lagi mengalami ReferenceError / gagal sinkron.
   2. Mendukung penuh:
      - POST /pilots/register (Pendaftaran akun + simpan snapshot awal)
      - POST /pilots/load     (Pemulihan akun lintas perangkat Web & APK)
      - POST /pilots/save     (Sinkronisasi otomatis koin, trofi, kapal, upgrade, karir)
      - POST /scores/submit   (Simpan skor otomatis ke Top 100 Global, 1 nama = 1 baris skor terbaik)
      - POST /scores/top      (Tarik daftar Top 100 Papan Peringkat Global)
   3. Sinkronisasi otomatis Rekor Skor Karir (mis. 65.940) ke Papan Global
      saat aplikasi dibuka maupun saat menekan tombol Sinkronkan Akun Cloud.
   ===================================================================== */
(function(){
  "use strict";
  var APP_URL = "https://rpkispipazjiunjylaxu.supabase.co/functions/v1/app";
  var GLOBAL_BOARD_KEY = "neon-survivor:global:board";
  window.REDBOUND_CLOUD_URL = APP_URL;
  if (!window.RedboundNet || APP_URL.indexOf("__") === 0) return;
  var net = window.RedboundNet;

  function B() {
    return window.__rbBridge || null;
  }

  function sGet(k) {
    try {
      if (B() && B().SafeStorage) return B().SafeStorage.getItem(k);
      return localStorage.getItem(k);
    } catch(e) { return null; }
  }

  function sSet(k, v) {
    try {
      if (B() && B().SafeStorage) B().SafeStorage.setItem(k, v);
      else localStorage.setItem(k, v);
    } catch(e) {}
  }

  function hashPwd(str) {
    try {
      if (B() && typeof B().rbHash === "function") return B().rbHash(str);
    } catch(e) {}
    var s = String(str || "").trim().toLowerCase();
    var h1 = 0xdeadbeef ^ s.length, h2 = 0x41c6ce57 ^ s.length;
    for (var i = 0, ch; i < s.length; i++) {
      ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");
  }

  function getAccountsMap() {
    try {
      if (B() && typeof B().loadAccounts === "function") return B().loadAccounts() || {};
      var raw = sGet("neon-survivor:accounts");
      if (raw) return JSON.parse(raw) || {};
    } catch(e) {}
    return {};
  }

  function mySess() {
    try {
      if (B() && typeof B().getSession === "function") {
        var s = B().getSession();
        if (s) return s;
      }
      var raw = sGet("neon-survivor:session");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return window.currentPilotSession || null;
  }

  function toastMsg(en, id, force) {
    var now = Date.now();
    if (!force && toastMsg._last && now - toastMsg._last < 15000) return;
    toastMsg._last = now;
    try {
      if (B() && typeof B().toast === "function") B().toast(en, id);
    } catch(e) {}
  }

  function post(path, bodyObj, timeoutMs) {
    return new Promise(function(resolve){
      var done = false;
      var body = JSON.stringify(bodyObj || {});
      var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var opts = {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: body
      };
      if (ctrl) opts.signal = ctrl.signal;
      if ((path === "/pilots/save" || path === "/scores/submit") && body.length < 60000) opts.keepalive = true;
      var to = setTimeout(function(){
        if (!done) {
          done = true;
          try { ctrl && ctrl.abort(); } catch(e){}
          resolve({ ok: false, error: "timeout" });
        }
      }, timeoutMs || 9000);
      try {
        fetch(APP_URL + path, opts).then(function(r){
          var st = r.status;
          return r.json().catch(function(){ return { ok: false, error: "respon tidak valid" }; }).then(function(j){
            if (j && typeof j === "object") {
              j.status = (j.status !== undefined) ? j.status : st;
            }
            return j;
          });
        }).then(function(j){
          if (done) return;
          done = true;
          clearTimeout(to);
          resolve(j || { ok: false });
        }).catch(function(e){
          if (done) return;
          done = true;
          clearTimeout(to);
          resolve({ ok: false, error: String(e && e.message || e) });
        });
      } catch(e) {
        if (!done) {
          done = true;
          clearTimeout(to);
          resolve({ ok: false, error: String(e) });
        }
      }
    });
  }

  function getMetaState() {
    try {
      if (B() && typeof B().getMeta === "function" && B().getMeta()) return B().getMeta();
      var raw = sGet("neon-survivor:meta");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { cores: 0, trophies: 0, levels: {}, chars: ["volt"], sel: "volt" };
  }

  function getProgressState() {
    try {
      if (B() && typeof B().getProgress === "function" && B().getProgress()) return B().getProgress();
      var raw = sGet("neon-survivor:progress");
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { counters: {}, ach: [] };
  }

  function getBestScoreState() {
    var b = 0;
    try {
      if (B() && typeof B().getBest === "function") b = Math.max(b, Number(B().getBest()) || 0);
      b = Math.max(b, Number(sGet("neon-survivor:best")) || 0);
      var p = getProgressState();
      if (p && p.counters && p.counters.bestScore) b = Math.max(b, Number(p.counters.bestScore) || 0);
    } catch(e) {}
    return b;
  }

  function getActiveCallsign() {
    var sess = mySess();
    var cs = "";
    try {
      if (sess && sess.callsign && sess.callsign !== "OFFLINE-PILOT") cs = sess.callsign;
      if (!cs && B() && typeof B().getCallsign === "function") cs = B().getCallsign();
      if (!cs) cs = sGet("neon-survivor:name") || "";
    } catch(e) {}
    cs = String(cs || "PILOT").trim().slice(0, 16);
    return cs || "PILOT";
  }

  function vaultSnapshot(sess, ph) {
    var rev = Number(sGet("neon-survivor:cloudRev") || 0) + 1;
    var now = Date.now();
    sSet("neon-survivor:cloudRev", String(rev));
    sSet("neon-survivor:cloudTs", String(now));
    var metaObj = getMetaState();
    var progObj = getProgressState();
    var bestVal = getBestScoreState();
    var dangerVal = 0;
    try {
      dangerVal = (B() && typeof B().getDanger === "function") ? B().getDanger() : (Number(sGet("neon-survivor:danger")) || 0);
    } catch(e) {}
    return {
      type: "cloud_vault_save",
      schemaVersion: "2.1.6.4",
      rev: rev,
      updatedAt: now,
      callsign: (sess && sess.callsign) || getActiveCallsign(),
      email: (sess && sess.email) || "",
      pwdHash: ph,
      meta: metaObj,
      progress: progObj,
      best: bestVal,
      danger: dangerVal
    };
  }

  function collectAuth() {
    var sess = mySess();
    if (!sess) return null;
    var loginId = String(sess.email || sess.loginId || "").trim().toLowerCase();
    var accs = getAccountsMap();
    if (!loginId && sess.callsign) {
      var byCs = accs[String(sess.callsign).trim().toLowerCase()];
      if (byCs && byCs.email) loginId = String(byCs.email).trim().toLowerCase();
    }
    if (!loginId || (sess.isGuest && !sess.pwdHash && !sess.email)) return null;
    var ph = sess.pwdHash || "";
    if (!ph) {
      var rec = accs[loginId] || accs[String(sess.callsign || "").trim().toLowerCase()];
      if (rec && rec.code) {
        ph = hashPwd(rec.code);
        sess.pwdHash = ph;
        try { if (B() && B().setSession) B().setSession(sess); else sSet("neon-survivor:session", JSON.stringify(sess)); } catch(e) {}
      }
    }
    if (!ph) return null;
    return { loginId: loginId, pwdHash: ph, sess: sess };
  }

  // 1) Nonaktifkan penyimpanan vault via MQTT publik
  net.subscribeSessionVault = function() {};

  // 2) pushCloudVault -> POST /pilots/save (mendukung mode immediate ataupun debounce)
  var pushTimer = null;
  function doPush(showFeedback) {
    pushTimer = null;
    var a = collectAuth();
    if (!a) return Promise.resolve({ ok: false, error: "no_auth" });
    var snap = vaultSnapshot(a.sess, a.pwdHash);
    return post("/pilots/save", {
      login_id: a.loginId,
      pwd_hash: a.pwdHash,
      callsign: snap.callsign,
      snapshot: snap
    }).then(function(res){
      if (!res) return { ok: false };
      if (res.ok === false && res.code === "NOACCOUNT") {
        // Auto-register akun di server bila sebelumnya dibuat saat offline
        return post("/pilots/register", {
          login_id: a.loginId,
          pwd_hash: a.pwdHash,
          callsign: snap.callsign,
          snapshot: snap
        }).then(function(r2){
          if (r2 && r2.ok) {
            return post("/pilots/save", {
              login_id: a.loginId,
              pwd_hash: a.pwdHash,
              callsign: snap.callsign,
              snapshot: snap
            });
          }
          return r2 || res;
        });
      }
      if (res.ok === false && (res.status === 401 || res.status === 409)) {
        toastMsg("⚠ Cloud: account exists with a different Access Code.", "⚠ Cloud: akun sudah ada dengan Kode Akses berbeda.", showFeedback);
      } else if (res.ok === false && res.error !== "timeout") {
        if (showFeedback) {
          toastMsg("⚠ Cloud server unreachable — check Supabase Edge Function 'app'.", "⚠ Server Supabase belum merespons — pastikan fungsi 'app' aktif.", true);
        }
      }
      return res;
    });
  }

  net.pushCloudVault = function(immediate) {
    if (net._suppressCloudPush) return Promise.resolve({ ok: false, suppressed: true });
    if (!collectAuth()) return Promise.resolve({ ok: false, noAuth: true });
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (immediate) return doPush(false);
    pushTimer = setTimeout(function(){ doPush(false); }, 1200);
    return Promise.resolve({ ok: true, queued: true });
  };

  try {
    window.addEventListener("pagehide", function(){ if (pushTimer) { clearTimeout(pushTimer); doPush(false); } }, { passive: true });
    window.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden" && pushTimer) { clearTimeout(pushTimer); doPush(false); } }, { passive: true });
  } catch(e) {}

  // 3) pullCloudAccount -> POST /pilots/load
  net.pullCloudAccount = function(idVal, pwdVal, timeoutMs) {
    var id = String(idVal || "").trim().toLowerCase();
    try {
      var accs = getAccountsMap();
      var rec = accs[id];
      if (rec && rec.email) id = String(rec.email).trim().toLowerCase();
    } catch(e) {}
    var ph = hashPwd(pwdVal);
    return post("/pilots/load", { login_id: id, pwd_hash: ph }, timeoutMs || 9000).then(function(res){
      if (!res || res.ok === false) return { found: false, unreachable: true };
      if (!res.found) return { found: false, notRegistered: true };
      if (res.authError) return { found: true, authError: true };
      return { found: true, authError: false, data: res.data };
    });
  };

  // 4) createCloudAccount -> POST /pilots/register (sekaligus kirim snapshot awal)
  net.createCloudAccount = function(idVal, pwdVal, callsignVal, timeoutMs) {
    var id = String(idVal || "").trim().toLowerCase();
    var ph = hashPwd(pwdVal);
    var cs = String(callsignVal || getActiveCallsign() || "PILOT").trim().toUpperCase().slice(0, 16);
    var snap = vaultSnapshot({ callsign: cs, email: id }, ph);
    return post("/pilots/register", {
      login_id: id,
      pwd_hash: ph,
      callsign: cs,
      snapshot: snap
    }, timeoutMs || 9000).then(function(res){
      if (!res || res.ok === false) {
        if (res && res.status === 409) return { ok: false, status: 409, error: (res && res.error) || "email sudah terdaftar" };
        var netDown = !(res && res.status);
        return { ok: false, unreachable: netDown, error: (res && res.error) || "gagal" };
      }
      return { ok: true, created: true, data: res.data || null };
    });
  };

  // 5) PAPAN PERINGKAT GLOBAL -> /scores/submit & /scores/top
  function normalizeScoreRows(rows) {
    if (!Array.isArray(rows)) return [];
    var myCs = getActiveCallsign().toUpperCase();
    var map = new Map();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r || typeof r !== "object") continue;
      var nm = String(r.name || r.callsign || "PILOT").trim().slice(0, 24);
      if (!nm) continue;
      // Jika ada entri OFFLINE-PILOT lama padahal pemain sudah punya callsign asli di daftar, lewati duplikat OFFLINE-PILOT bila skornya di bawah callsign asli
      var key = nm.toUpperCase();
      var sc = Number(r.score) || 0;
      if (sc <= 0) continue;
      var prev = map.get(key);
      if (!prev || sc > (Number(prev.score) || 0)) {
        map.set(key, {
          name: nm,
          score: sc,
          kills: Number(r.kills) || 0,
          survived: Number(r.survived) || 0,
          level: Number(r.level) || 1,
          bosses: Number(r.bosses) || 0,
          danger: Number(r.danger) || 0
        });
      }
    }
    var list = Array.from(map.values());
    list.sort(function(a, b){ return (b.score || 0) - (a.score || 0); });
    return list.slice(0, 100);
  }

  function getBestLocalCandidateForGlobal() {
    var cs = getActiveCallsign();
    var bestSc = getBestScoreState();
    var soloRows = [];
    try { soloRows = (B() && B().getSoloBoard) ? B().getSoloBoard() : JSON.parse(sGet("neon-survivor:offline:solo") || "[]"); } catch(e) {}
    var bestRow = null;
    for (var i = 0; i < soloRows.length; i++) {
      var r = soloRows[i];
      if (!r) continue;
      if (!bestRow || (Number(r.score) || 0) > (Number(bestRow.score) || 0)) bestRow = r;
    }
    var prog = getProgressState();
    var ctrs = (prog && prog.counters) || {};
    var sc = Math.max(bestSc, bestRow ? (Number(bestRow.score) || 0) : 0);
    if (sc <= 0) return null;
    var rowMatchesBest = bestRow && Math.abs((Number(bestRow.score) || 0) - sc) < 1;
    return {
      name: (cs && cs !== "OFFLINE-PILOT") ? cs : ((bestRow && bestRow.name) || cs || "PILOT"),
      callsign: (cs && cs !== "OFFLINE-PILOT") ? cs : ((bestRow && bestRow.name) || cs || "PILOT"),
      mode: "solo",
      score: sc,
      kills: rowMatchesBest ? (Number(bestRow.kills) || 0) : (Number(ctrs.bestRunKills || ctrs.kills) || 0),
      survived: rowMatchesBest ? (Number(bestRow.survived) || 0) : (Number(ctrs.bestSurvived) || 180),
      level: rowMatchesBest ? (Number(bestRow.level) || 1) : (Number(ctrs.maxLevel) || 1),
      bosses: rowMatchesBest ? (Number(bestRow.bosses) || 0) : (Number(ctrs.bosses) || 0),
      danger: rowMatchesBest ? (Number(bestRow.danger) || 0) : (Number(sGet("neon-survivor:danger")) || 0)
    };
  }

  net.getGlobalBoardRows = function() {
    var cached = [];
    try {
      var raw = sGet(GLOBAL_BOARD_KEY);
      if (raw) cached = JSON.parse(raw) || [];
    } catch(e) {}
    var bestLocal = getBestLocalCandidateForGlobal();
    var combined = cached.slice();
    if (bestLocal && bestLocal.score > 0) {
      combined.push(bestLocal);
      // Jika pilot sudah punya callsign resmi (mis. ALGRAFHIE), ganti baris OFFLINE-PILOT milik lokal bila ada
      if (bestLocal.name && bestLocal.name.toUpperCase() !== "OFFLINE-PILOT") {
        combined = combined.filter(function(r){
          return String(r.name || "").trim().toUpperCase() !== "OFFLINE-PILOT" || (Number(r.score) || 0) > bestLocal.score;
        });
      }
    }
    var norm = normalizeScoreRows(combined);
    try { sSet(GLOBAL_BOARD_KEY, JSON.stringify(norm)); } catch(e) {}

  var lastTopFetchAt = 0;
  var topFetchInFlight = null;
  net.fetchGlobalScores = function(force) {
    var now = Date.now();
    if (!force && topFetchInFlight) return topFetchInFlight;
    if (!force && now - lastTopFetchAt < 8000) return Promise.resolve(net.getGlobalBoardRows());
    lastTopFetchAt = now;
    topFetchInFlight = post("/scores/top", { limit: 100 }, 8000).then(function(res){
      topFetchInFlight = null;
      if (res && res.ok && Array.isArray(res.rows)) {
        var merged = normalizeScoreRows(res.rows);
        var bestLocal = getBestLocalCandidateForGlobal();
        if (bestLocal && bestLocal.score > 0) {
          var myKey = String(bestLocal.name || "").trim().toUpperCase();
          var srvRow = merged.find(function(r){ return String(r.name || "").trim().toUpperCase() === myKey; });
          if (!srvRow || (Number(srvRow.score) || 0) < bestLocal.score) {
            merged = normalizeScoreRows(merged.concat([bestLocal]));
            // Dorong rekor lokal yang lebih tinggi ke server Supabase
            net.submitGlobalScore(bestLocal, false);
          }
        }
        sSet(GLOBAL_BOARD_KEY, JSON.stringify(merged));
        if (B() && B().renderUI) B().renderUI();
        return merged;
      }
      return net.getGlobalBoardRows();
    }).catch(function(){
      topFetchInFlight = null;
      return net.getGlobalBoardRows();
    });
    return topFetchInFlight;
  };

  net.submitGlobalScore = function(entry, showRankToast) {
    if (!entry || !(Number(entry.score) > 0)) return Promise.resolve({ ok: false });
    var cs = String(entry.callsign || entry.name || getActiveCallsign() || "PILOT").trim().slice(0, 24);
    var auth = collectAuth();
    var payload = {
      name: cs,
      callsign: cs,
      login_id: auth ? auth.loginId : null,
      mode: entry.mode || "solo",
      score: Number(entry.score) || 0,
      kills: Number(entry.kills) || 0,
      survived: Number(entry.survived) || 0,
      level: Number(entry.level) || 1,
      bosses: Number(entry.bosses) || 0,
      danger: Number(entry.danger) || 0
    };
    // Simpan langsung ke cache global lokal agar UI instan
    var cur = net.getGlobalBoardRows();
    var updatedLocal = normalizeScoreRows(cur.concat([payload]));
    sSet(GLOBAL_BOARD_KEY, JSON.stringify(updatedLocal));
    if (B() && B().renderUI) B().renderUI();

    return post("/scores/submit", payload, 9000).then(function(res){
      if (res && res.ok) {
        if (Array.isArray(res.top)) {
          var norm = normalizeScoreRows(res.top);
          sSet(GLOBAL_BOARD_KEY, JSON.stringify(norm));
        }
        var rank = res.rank || ( net.getGlobalBoardRows().findIndex(function(r){ return String(r.name||"").trim().toUpperCase() === cs.toUpperCase(); }) + 1 );
        if (showRankToast && rank > 0 && rank <= 100) {
          toastMsg("🏆 Global Rank #" + rank + "!", "🏆 Peringkat global #" + rank + "!", true);
        }
        if (B() && B().renderUI) B().renderUI();
      }
      return res || { ok: false };
    });
  };

  // 6) Boot Auto-Sync & Manual Full Sync (Pull + Merge + Push Vault + Sync Best Global Score)
  net.syncAllCloudNow = function(announce) {
    var auth = collectAuth();
    var bestCandidate = getBestLocalCandidateForGlobal();
    var pScore = bestCandidate ? net.submitGlobalScore(bestCandidate, false) : net.fetchGlobalScores(true);
    if (!auth) {
      return pScore.then(function(){ return { ok: true, guestOnly: true }; });
    }
    return post("/pilots/load", { login_id: auth.loginId, pwd_hash: auth.pwdHash }, 8000).then(function(loadRes){
      if (loadRes && loadRes.ok && loadRes.found && !loadRes.authError && loadRes.data) {
        if (B() && B().applyCloudSnapshot) {
          B().applyCloudSnapshot(loadRes.data, false);
        }
      }
      return doPush(!!announce);
    }).then(function(saveRes){
      var updatedBest = getBestLocalCandidateForGlobal();
      if (updatedBest) net.submitGlobalScore(updatedBest, false);
      net.fetchGlobalScores(true);
      if (B() && B().renderUI) B().renderUI();
      return saveRes || { ok: false };
    });
  };

  net.bootCloudSync = function() {
    try {
      if (B() && B().dedupBoards) B().dedupBoards();
      var bestCandidate = getBestLocalCandidateForGlobal();
      if (bestCandidate && bestCandidate.score > 0) {
        net.submitGlobalScore(bestCandidate, false);
      }
      net.fetchGlobalScores(true);
      var auth = collectAuth();
      if (auth) {
        net.syncAllCloudNow(false);
      }
    } catch(e) {}
  };

  window.REDBOUND_CLOUD = {
    url: APP_URL,
    version: "v2.1.6.8",
    push: function(){ return net.pushCloudVault(true); },
    pull: function(id, pw){ return net.pullCloudAccount(id, pw); },
    syncNow: function(){ return net.syncAllCloudNow(true); },
    fetchScores: function(){ return net.fetchGlobalScores(true); }
  };
})();
</script>

(function(){

    try{

      setTimeout(function(){t.remove();},3000);
    }catch(e){}
  }
  // ---- 1) Setelah refresh: kembali masuk ke arena tempur (run dimulai ulang di arena yang sama) ----
  try{
    var isRoom=/[?&]room=/.test(location.search);
    var sess=null; try{ sess=JSON.parse(localStorage.getItem(LK)||"null"); }catch(e){}
    var lovl=document.getElementById("loginOvl");
    var loginVisible=!!(lovl&&lovl.style.display!=="none");
    var raw=null; try{ raw=localStorage.getItem(BK); }catch(e){}
    if(!isRoom&&sess&&!loginVisible&&raw){
      var inf=null; try{ inf=JSON.parse(raw); }catch(e){}
      try{ localStorage.removeItem(BK); }catch(e){}
      if(inf&&(inf.mode==="timed"||inf.mode==="mission")&&(Date.now()-(inf.at||0))<30*60*1000){
        setTimeout(function(){
          try{
            var want=inf.mode==="timed"?"Time Attack":"Mission";
            var rows=document.querySelectorAll(".seg-tabs"),modeRow=null;
            for(var i=0;i<rows.length&&!modeRow;i++){
              var bs=rows[i].querySelectorAll("button");
              for(var j=0;j<bs.length;j++){ if(bs[j].textContent.trim()==="Time Attack"){ modeRow=rows[i]; break; } }
            }
            if(!modeRow)return;
            var mbtn=null,bs2=modeRow.querySelectorAll("button");
            for(var k=0;k<bs2.length;k++){ if(bs2[k].textContent.trim()===want){ mbtn=bs2[k]; break; } }
            if(!mbtn)return;
            mbtn.click();
            setTimeout(function(){
              try{
                var all=document.querySelectorAll("button"),lb=null;
                for(var m=0;m<all.length;m++){ var tt=all[m].textContent.trim(); if(tt==="START BATTLE"||tt==="MULAI TEMPUR"){ lb=all[m]; break; } }

              }catch(e){}

          }catch(e){}

  // ---- 2) Tombol kembali -> dialog konfirmasi keluar; back 2x saat dialog terbuka = keluar ----
  var dlg=null,exiting=false;
  function ensureDlg(){
    if(dlg&&dlg.isConnected)return dlg;
    dlg=document.createElement("div");
    dlg.id="rbExitOvl";
    dlg.style.cssText="position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;display:none;align-items:center;justify-content:center;background:rgba(2,3,12,.84)";
    dlg.innerHTML='<div style="max-width:330px;width:88%;background:#0b0e1d;border:1px solid rgba(34,211,238,.35);border-radius:14px;padding:18px 16px;text-align:center;font-family:ui-monospace,Menlo,monospace;box-shadow:0 0 44px rgba(34,211,238,.15)">'
      +'<div style="font-weight:900;letter-spacing:1px;color:#e2e8f0;font-size:15px;margin-bottom:7px">'+tr("\u27F5 EXIT REDBOUND?","\u27F5 KELUAR DARI REDBOUND?")+'</div>'

      +'<div style="display:flex;gap:10px;justify-content:center">'
      +'<button id="rbExitNo" style="flex:1;padding:10px 6px;border-radius:10px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-weight:800;font-size:12px;font-family:inherit;cursor:pointer">'+tr("STAY","BATAL")+'</button>'
      +'<button id="rbExitYes" style="flex:1;padding:10px 6px;border-radius:10px;border:1px solid rgba(239,68,68,.55);background:#2a0d12;color:#fca5a5;font-weight:800;font-size:12px;font-family:inherit;cursor:pointer">'+tr("EXIT APP","KELUAR")+'</button>'
      +'</div></div>';
    document.body.appendChild(dlg);
    dlg.querySelector("#rbExitNo").addEventListener("click",function(ev){ev.stopPropagation();dlg.style.display="none";});
    dlg.querySelector("#rbExitYes").addEventListener("click",function(ev){ev.stopPropagation();confirmExit();});
    return dlg;
  }
  function showDlg(){ensureDlg().style.display="flex";}
  function dlgOpen(){return !!(dlg&&dlg.isConnected&&dlg.style.display!=="none");}
  function confirmExit(){
    if(dlgOpen())dlg.style.display="none";
    exiting=true;
    try{if(window.RedboundApp&&typeof window.RedboundApp.exit==="function"){window.RedboundApp.exit();return;}}catch(e){}
    try{window.close();}catch(e){}
    setTimeout(function(){try{history.back();}catch(e){}},80);

      if(exiting&&!document.hidden){

  }

  window.__rbAndroidBack=function(){

  // Trap history utk browser: back pertama -> dialog, back kedua -> keluar
  try{
    history.replaceState({rbTrap:1},"");
    history.pushState({rbTrap:2},"");
    window.addEventListener("popstate",function(){
      if(exiting)return;
      if(dlgOpen()){confirmExit();}
      else{
        showDlg();
        setTimeout(function(){try{history.pushState({rbTrap:2},"")}catch(e){}},0);
      }
    });
  }catch(e){}
})();

<script>
(() => {
  const overlay = document.getElementById("rbOpeningIntroOverlay");
  const canvas = document.getElementById("rbOpeningIntroCanvas");
  const emblemBox = document.getElementById("rbIntroEmblemBox");
  const dockedShip = document.getElementById("rbIntroDockedShip");
  const loaderWrap = document.getElementById("rbIntroLoaderWrap");
  const loaderFill = document.getElementById("rbIntroLoaderFill");
  const loaderNodes = document.querySelectorAll("#rbIntroLoaderNodes .rb-loader-node");
  const introAudioEl = document.getElementById("rbIntroAutoAudio");
  const menuAudioEl = document.getElementById("rbMenuAutoAudio");
  if (!overlay || !canvas) return;

  const SHIP_PHASE_END = 4300;
  const LOADER_START = 4050;
  const INTRO_DURATION = 8550;

  // Fast Runtime PCM WAV Synthesizer (Zero HTML bloat, plays via HTML5 <audio autoplay> AND WebAudio)
  function encodeWavFromSamples(samples, sr) {
    const n = samples.length;
    const buf = new ArrayBuffer(44 + n);
    const view = new DataView(buf);
    const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    writeStr(0, "RIFF");
    view.setUint32(4, 36 + n, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr, true);
    view.setUint16(32, 1, true);
    view.setUint16(34, 8, true);
    writeStr(36, "data");
    view.setUint32(40, n, true);
    for (let i = 0; i < n; i++) {
      const v = Math.max(-1, Math.min(1, samples[i]));
      view.setUint8(44 + i, ((v * 0.5 + 0.5) * 255) | 0);
    }
    const bytes = new Uint8Array(buf);
    let bin = "";
    const chunk = 8192;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return "data:audio/wav;base64," + btoa(bin);
  }

  function buildIntroWavUri() {
    const sr = 6000;
    const dur = 8.4;
    const n = (sr * dur) | 0;
    const samples = new Float32Array(n);

    // 1. Jet dive turbine sweep (0.0s .. 0.85s)
    for (let i = 0; i < (0.85 * sr) | 0; i++) {
      const t = i / sr;
      const env = Math.sin((t / 0.85) * Math.PI) * 0.25;
      const freq = 250 * Math.pow(72 / 250, t / 0.85);
      samples[i] += env * Math.sin(2 * Math.PI * freq * t);
    }

    // 2. Authentic Redbound shoot() barrage (0.65s .. 3.65s)
    let shotT = 0.65, shotIdx = 0;
    while (shotT < 3.65) {
      const s0 = (shotT * sr) | 0;
      const sLen = (0.085 * sr) | 0;
      const pMul = 1 + (shotIdx % 4) * 0.06;
      for (let k = 0; k < sLen && s0 + k < n; k++) {
        const dt = k / sr;
        const fCur = (880 * pMul) * Math.pow(320 / 880, dt / 0.085);
        const env = Math.pow(1 - dt / 0.085, 1.6) * 0.34;
        const sq = Math.sin(2 * Math.PI * fCur * dt) >= 0 ? 1 : -1;
        const rail = Math.sin(2 * Math.PI * (185 * (1 - dt * 5.5)) * dt) * 0.45;
        samples[s0 + k] += env * (sq * 0.65 + rail * 0.35);
      }
      shotT += 0.062;
      shotIdx++;
    }

    // 3. Hunter Missile whooshes
    for (const mt of [0.75, 1.15, 1.55, 1.95, 2.35, 2.75, 3.15, 3.50]) {
      const s0 = (mt * sr) | 0;
      const mLen = (0.18 * sr) | 0;
      for (let k = 0; k < mLen && s0 + k < n; k++) {
        const dt = k / sr;
        const env = Math.sin((dt / 0.18) * Math.PI) * 0.24;
        const whoosh = (Math.sin(k * 12.9898) * 0.5) + Math.sin(2 * Math.PI * (500 + dt * 1100) * dt) * 0.5;
        samples[s0 + k] += env * whoosh;
      }
    }

    // 4. Sonic Boom Impact at 3.80s
    const imp0 = (3.80 * sr) | 0;
    const impLen = (0.65 * sr) | 0;
    for (let k = 0; k < impLen && imp0 + k < n; k++) {
      const dt = k / sr;
      const env = Math.pow(1 - dt / 0.65, 1.8) * 0.48;
      const subF = 165 * Math.pow(35 / 165, dt / 0.65);
      samples[imp0 + k] += env * (Math.sin(2 * Math.PI * subF * dt) * 0.7 + Math.sin(k * 78.233) * 0.3);
    }

    // 5. Phase 2: App Loading Telemetry Ticks & Rising Reactor Hum (4.15s .. 7.85s)
    let loadT = 4.15, tickIdx = 0;
    while (loadT < 7.85) {
      const s0 = (loadT * sr) | 0;
      const tLen = (0.055 * sr) | 0;
      const prog = (loadT - 4.15) / 3.7;
      const baseF = 440 + prog * 540 + (tickIdx % 3) * 60;
      for (let k = 0; k < tLen && s0 + k < n; k++) {
        const dt = k / sr;
        const env = Math.pow(1 - dt / 0.055, 1.8) * 0.20;
        samples[s0 + k] += env * Math.sin(2 * Math.PI * baseF * dt);
      }
      loadT += 0.11;
      tickIdx++;
    }

    // 6. 100% Ready Chime Arpeggio at 7.90s .. 8.38s
    const notes = [523.25, 659.25, 783.99, 1046.5];
    for (let idxN = 0; idxN < notes.length; idxN++) {
      const s0 = ((7.90 + idxN * 0.08) * sr) | 0;
      const cLen = (0.22 * sr) | 0;
      for (let k = 0; k < cLen && s0 + k < n; k++) {
        const dt = k / sr;
        const env = Math.pow(1 - dt / 0.22, 1.5) * 0.28;
        samples[s0 + k] += env * Math.sin(2 * Math.PI * notes[idxN] * dt);
      }
    }
    return encodeWavFromSamples(samples, sr);
  }

  // Build Authentic Redbound Menu Synthwave BGM Loop WAV (so Menu Games has automatic music even before a tap!)
  function buildMenuBgmWavUri() {
    const sr = 6000;
    const stepSec = 0.16;
    const steps = 32; // 5.12s seamless loop
    const dur = steps * stepSec;
    const n = (sr * dur) | 0;
    const samples = new Float32Array(n);
    const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const bassNotes = [45, 45, 57, 45, 48, 48, 60, 48, 43, 43, 55, 43, 50, 50, 62, 50];
    const arpNotes  = [69, 72, 76, 81, 69, 72, 76, 84, 67, 71, 74, 79, 69, 72, 76, 81];

    for (let st = 0; st < steps; st++) {
      const s0 = (st * stepSec * sr) | 0;
      const sLen = (stepSec * sr) | 0;
      const bFreq = midi(bassNotes[st % bassNotes.length]);
      const aFreq = midi(arpNotes[st % arpNotes.length]);
      const isKick = (st % 4 === 0);

      for (let k = 0; k < sLen && s0 + k < n; k++) {
        const dt = k / sr;
        // Synth bass
        const bEnv = Math.pow(1 - dt / stepSec, 1.4) * 0.22;
        const bass = Math.sin(2 * Math.PI * bFreq * dt) * 0.7 + (Math.sin(2 * Math.PI * bFreq * dt) >= 0 ? 0.3 : -0.3);
        // Pluck arpeggio
        const aEnv = Math.pow(1 - dt / stepSec, 2.2) * 0.16;
        const arp = Math.sin(2 * Math.PI * aFreq * dt);
        // Subtle kick pulse on beat
        let kick = 0;
        if (isKick && dt < 0.09) {
          const kFreq = 130 * Math.pow(38 / 130, dt / 0.09);
          kick = (1 - dt / 0.09) * 0.26 * Math.sin(2 * Math.PI * kFreq * dt);
        }
        samples[s0 + k] += bEnv * bass + aEnv * arp + kick;
      }
    }
    return encodeWavFromSamples(samples, sr);
  }

  let introWavPlaying = false;
  let menuWavPlaying = false;

  try {
    if (introAudioEl) {
      introAudioEl.src = buildIntroWavUri();
      introAudioEl.volume = 0.88;
    }
    if (menuAudioEl) {
      menuAudioEl.src = buildMenuBgmWavUri();
      menuAudioEl.volume = 0.48;
    }
  } catch (e) {}

  let localActx = null;
  function getAudioCtx() {
    const g = window.__neon;
    if (g && g.audio) {
      try {
        g.audio.init();
        if (g.audio.ctx && g.audio.ctx.state === "suspended") g.audio.ctx.resume().catch(() => {});
        if (g.audio.ctx && g.audio.ctx.state === "running") return g.audio.ctx;
      } catch (e) {}
    }
    if (!localActx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try { localActx = new AC(); } catch (e) {}
      }
    }
    if (localActx && localActx.state === "suspended") {
      localActx.resume().catch(() => {});
    }
    return localActx;
  }

  let introStart = performance.now();
  let finished = false;

  // Aggressive Multi-Channel Auto-Play & Menu Music Bridge
  function tryAutoStartAllAudio() {
    const actx = getAudioCtx();
    const g = window.__neon;
    const webAudioRunning = Boolean(actx && actx.state === "running");

    // 1. If WebAudio is running and we are past intro (or in menu), ensure native H.audio menu music is playing
    if (g && g.audio && g.audio.ctx && g.audio.ctx.state === "running") {
      if (finished && g.state === "menu" && g.audio.musicEnabled && !g.audio.muted) {
        const lovl = document.getElementById("loginOvl");
        const mode = (lovl && lovl.style.display !== "none") ? "login" : "menu";
        if (!g.audio.musicPlaying || g.audio.musicMode !== mode) {
          g.audio.startMusic(mode);
        }
        // Stop fallback HTML5 menu loop so there is no double music
        if (menuAudioEl && !menuAudioEl.paused) {
          try { menuAudioEl.pause(); } catch (e) {}
        }
      }
    }

    // 2. During Intro: ensure introAudioEl is playing automatically
    if (!finished && introAudioEl && !introWavPlaying) {
      try {
        const elapsedSec = (performance.now() - introStart) / 1000;
        if (elapsedSec < 8.0 && introAudioEl.paused) {
          introAudioEl.currentTime = Math.max(0, Math.min(0.65, elapsedSec));
          const p = introAudioEl.play();
          if (p && p.then) {
            p.then(() => {
              introWavPlaying = true;
              // Piggyback on active HTMLMediaElement playback to unlock WebAudio immediately!
              getAudioCtx();
            }).catch(() => {});
          }
        }
      } catch (e) {}
    }

    // 3. After Intro (in Menu Games): if WebAudio is still suspended by browser policy, play Menu BGM via HTML5 <audio> automatically!
    if (finished && menuAudioEl) {
      const gMuted = Boolean(g && g.audio && (g.audio.muted || !g.audio.musicEnabled));
      const nativePlaying = Boolean(g && g.audio && g.audio.ctx && g.audio.ctx.state === "running" && g.audio.musicPlaying);
      if (gMuted || nativePlaying || (g && g.state !== "menu")) {
        if (!menuAudioEl.paused) {
          try { menuAudioEl.pause(); } catch (e) {}
        }
      } else if (menuAudioEl.paused) {
        try {
          const p = menuAudioEl.play();
          if (p && p.then) p.then(() => { menuWavPlaying = true; getAudioCtx(); }).catch(() => {});
        } catch (e) {}
      }
    }
  }

  // Poll every 250ms and attach to all lifecycle, focus, visibility, and pointer events
  const autoAudioInterval = setInterval(() => {
    tryAutoStartAllAudio();
    const g = window.__neon;
    if (finished && g && g.audio && g.audio.ctx && g.audio.ctx.state === "running" && g.audio.musicPlaying) {
      if (menuAudioEl && !menuAudioEl.paused) {
        try { menuAudioEl.pause(); } catch (e) {}
      }
      clearInterval(autoAudioInterval);
    }
  }, 250);

  for (const ev of ["DOMContentLoaded", "load", "pageshow", "focus", "visibilitychange", "mouseenter", "mousemove", "pointermove", "pointerdown", "touchstart", "touchend", "keydown", "click"]) {
    window.addEventListener(ev, tryAutoStartAllAudio, { passive: true, capture: true });

  tryAutoStartAllAudio();

  function sfxShootVolley(shotCount) {
    // If HTML5 intro WAV is already playing and WebAudio is suspended, HTML5 WAV covers the sound;

    if (g && g.audio && g.audio.ctx && g.audio.ctx.state === "running" && !g.audio.muted) {

      g.audio.tone(fPitch, 260, 0.085, "sawtooth", 0.055);

      const gain1 = actx.createGain();

      osc1.frequency.setValueAtTime(880 + (shotCount % 4) * 45, now);
      osc1.frequency.exponentialRampToValueAtTime(320, now + 0.085);
      gain1.gain.setValueAtTime(0.06, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      osc1.connect(gain1);
      gain1.connect(actx.destination);
      osc1.start(now);
      osc1.stop(now + 0.09);
    } catch (e) {}
  }

  function sfxMissileSalvo() {
    if (introWavPlaying && !introAudioEl.paused) return;
    const g = window.__neon;
    if (g && g.audio && g.audio.ctx && g.audio.ctx.state === "running" && !g.audio.muted) {
      g.audio.noise(0.14, 0.075, "highpass", 1500);
      g.audio.tone(520, 980, 0.12, "triangle", 0.06);

  function sfxSonicImpact() {
    if (introWavPlaying && !introAudioEl.paused) return;

  function sfxLoaderReady() {
    if (introWavPlaying && !introAudioEl.paused) return;

  let W = window.innerWidth || 400;
  let H = window.innerHeight || 800;
  let dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 400;
    H = window.innerHeight || 800;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  window.addEventListener("resize", resize);

  const shipImg = new Image();
  const droneImg = new Image();
  function sync3dSprites() {
    const domShip = document.getElementById("ship3dImg");
    const domDrone = document.getElementById("drone3dImg");
    if (domShip && domShip.src && !shipImg.src) {

    if (domDrone && domDrone.src && !droneImg.src) {

  sync3dSprites();
  document.addEventListener("DOMContentLoaded", sync3dSprites);

  const stars = [];
  const bullets = [];
  const missiles = [];
  const particles = [];
  const shockwaves = [];
  const smokePuffs = [];

  for (let i = 0; i < 95; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      spd: 2.5 + Math.random() * 8.5,
      sz: 0.9 + Math.random() * 2.1,
      col: Math.random() > 0.28 ? "#00f0ff" : "#f43f5e",
      alpha: 0.25 + Math.random() * 0.72
    });
  }

  let lastShotTime = 0;
  let lastMissileTime = 0;
  let lastTickTime = 0;
  let shotCounter = 0;
  let impactTriggered = false;
  let loaderShown = false;
  let readyChimePlayed = false;

  function spawnSuperDenseBarrage(sx, sy, elapsed) {
    shotCounter++;
    sfxShootVolley(shotCounter);

    const count = 11;
    const baseAngle = Math.PI / 2;
    const spread = 0.78;

    for (const offset of [-13, 0, 13]) {
      bullets.push({
        x: sx + offset,
        y: sy + 38,
        vx: (Math.random() - 0.5) * 0.5,
        vy: 15.0 + Math.random() * 2.5,
        len: 32,
        w: 4.5,
        col: "#f43f5e",
        core: "#ffffff"
      });
    }

    for (let i = 0; i < count; i++) {
      const frac = (i / (count - 1)) - 0.5;
      const ang = baseAngle + frac * spread + Math.sin(elapsed * 0.012) * 0.09;
      const spd = 11.8 + Math.cos(frac * Math.PI) * 3.2;
      const isOuter = Math.abs(frac) > 0.3;
      const muzzleX = sx + frac * 76;
      const muzzleY = sy + 18 + (1 - Math.abs(frac)) * 20;

      bullets.push({
        x: muzzleX,
        y: muzzleY,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        len: isOuter ? 20 : 26,
        w: isOuter ? 3.2 : 3.9,
        col: isOuter ? "#f43f5e" : "#00f0ff",
        core: "#e0f2fe"
      });
    }

    for (const side of [-1, 1]) {
      const dx = sx + side * 88;
      const dy = sy - 24;
      for (const sub of [-5, 5]) {
        bullets.push({
          x: dx + sub,
          y: dy + 20,
          vx: side * 0.75,
          vy: 14.0,
          len: 22,
          w: 3.2,
          col: "#a855f7",
          core: "#f3e8ff"
        });
      }
    }

    for (let s = 0; s < 10; s++) {
      const side = s % 2 === 0 ? -1 : 1;
      particles.push({
        x: sx + side * (14 + Math.random() * 30),
        y: sy + 28,
        vx: (Math.random() - 0.5) * 5.0,
        vy: 5.0 + Math.random() * 6.0,
        r: 2.0 + Math.random() * 2.6,
        life: 1.0,
        decay: 0.08 + Math.random() * 0.05,
        col: Math.random() > 0.4 ? "#00f0ff" : "#f43f5e"
      });
    }
  }

  function spawnHunterMissiles(sx, sy) {
    sfxMissileSalvo();
    for (const side of [-1, 1]) {
      missiles.push({
        x: sx + side * 46,
        y: sy + 8,
        vx: side * (3.2 + Math.random() * 1.8),
        vy: 6.4,
        targetX: W * 0.5 + (Math.random() - 0.5) * (Math.min(W, 430) * 0.68),
        trail: [],
        col: side < 0 ? "#f43f5e" : "#00f0ff"
      });
    }
  }

  function draw3dShip(cx, cy, scale, bank, now) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.rotate(bank * 0.18);
    ctx.rotate(Math.PI);

    const aura = ctx.createRadialGradient(0, 0, 8, 0, 0, 94);
    aura.addColorStop(0, "rgba(0, 240, 255, 0.36)");
    aura.addColorStop(0.55, "rgba(244, 63, 94, 0.18)");
    aura.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, 94, 0, Math.PI * 2);
    ctx.fill();

    const pulse = 0.85 + 0.32 * Math.sin(now * 0.048);
    for (const tx of [-13, 13]) {
      const ty = 44;
      const flLen = 62 * pulse;
      const grad = ctx.createLinearGradient(tx, ty, tx, ty + flLen);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.25, "#00f0ff");
      grad.addColorStop(0.65, "#f43f5e");
      grad.addColorStop(1, "rgba(244, 63, 94, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(tx - 6.8, ty);
      ctx.quadraticCurveTo(tx, ty + flLen * 1.15, tx + 6.8, ty);
      ctx.closePath();
      ctx.fill();
    }

    const cFlLen = 64 * pulse;
    const cGrad = ctx.createLinearGradient(0, 48, 0, 48 + cFlLen);
    cGrad.addColorStop(0, "#ffffff");
    cGrad.addColorStop(0.35, "#38bdf8");
    cGrad.addColorStop(0.8, "rgba(244, 63, 94, 0.78)");
    cGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.moveTo(-8.5, 46);
    ctx.quadraticCurveTo(0, 46 + cFlLen * 1.2, 8.5, 46);
    ctx.closePath();
    ctx.fill();

    if (shipImg.complete && shipImg.naturalWidth > 0) {
      ctx.drawImage(shipImg, -70, -70, 140, 140);
    }

    const flashAlpha = 0.6 + 0.4 * Math.sin(now * 0.085);
    for (const wx of [-36, -16, 16, 36]) {
      const wy = -26;
      const mg = ctx.createRadialGradient(wx, wy, 1, wx, wy, 15);
      mg.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
      mg.addColorStop(0.45, `rgba(0,240,255,${flashAlpha * 0.88})`);
      mg.addColorStop(1, "rgba(0,240,255,0)");
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(wx, wy, 15, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    if (droneImg.complete && droneImg.naturalWidth > 0) {
      for (const side of [-1, 1]) {
        const dx = cx + side * 88 + Math.sin(now * 0.008 + side) * 6;
        const dy = cy - 26 + Math.cos(now * 0.01 + side) * 5;
        ctx.save();
        ctx.translate(dx, dy);
        ctx.rotate(Math.PI);
        ctx.drawImage(droneImg, -26, -26, 52, 52);
        ctx.restore();
      }
    }
  }

  function step(now) {
    if (finished) return;
    sync3dSprites();
    const elapsed = now - introStart;

    if (elapsed >= INTRO_DURATION) {
      finished = true;
      overlay.classList.add("rb-intro-hide");
      tryAutoStartAllAudio();
      setTimeout(() => {
        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        tryAutoStartAllAudio();
      }, 620);
      return;
    }

    ctx.clearRect(0, 0, W, H);

    const warpMult = (elapsed > 150 && elapsed < SHIP_PHASE_END) ? 2.8 : 1.15;
    for (const st of stars) {
      st.y -= st.spd * warpMult;
      if (st.y < -25) {
        st.y = H + 25;
        st.x = Math.random() * W;
      }
      ctx.strokeStyle = st.col;
      ctx.globalAlpha = st.alpha;
      ctx.lineWidth = st.sz;
      ctx.beginPath();
      ctx.moveTo(st.x, st.y);
      ctx.lineTo(st.x, st.y + st.spd * warpMult * 2.3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const stageW = Math.min(W, 430);
    let shipY = -140;
    let shipX = W * 0.5;
    let shipScale = 1.0;
    let shipBank = 0;
    let shipVisible = false;

    if (elapsed < 750) {
      shipVisible = true;
      const t = elapsed / 750;
      const easeOut = 1 - Math.pow(1 - t, 3);
      shipY = -140 + easeOut * (H * 0.19 - (-140));
      shipScale = 0.84 + easeOut * 0.24;
    } else if (elapsed < 3550) {
      shipVisible = true;
      const t = (elapsed - 750) / 2800;
      shipY = (H * 0.19) + t * (H * 0.42);
      const weave = Math.sin(t * Math.PI * 4.0);
      shipX = W * 0.5 + weave * (stageW * 0.16);
      shipBank = weave * 0.65;
      shipScale = 1.08 + Math.sin(t * Math.PI) * 0.10;

      if (now - lastShotTime > 60) {
        spawnSuperDenseBarrage(shipX, shipY, elapsed);
        lastShotTime = now;
      }
      if (now - lastMissileTime > 340) {
        spawnHunterMissiles(shipX, shipY);
        lastMissileTime = now;
      }
    } else if (elapsed < SHIP_PHASE_END) {
      shipVisible = true;
      const t = (elapsed - 3550) / (SHIP_PHASE_END - 3550);
      const easeIn = t * t * t;
      shipY = (H * 0.61) + easeIn * (H * 0.65);
      shipX = W * 0.5;
      shipScale = 1.18 + easeIn * 0.35;

      if (!impactTriggered && t > 0.15) {
        impactTriggered = true;
        sfxSonicImpact();
        if (emblemBox) emblemBox.classList.add("rb-impact");
        shockwaves.push({
          x: W * 0.5,
          y: H * 0.46,
          r: 20,
          maxR: stageW * 0.78,
          alpha: 0.95,
          col: "#00f0ff"
        });
        shockwaves.push({
          x: W * 0.5,
          y: H * 0.46,
          r: 10,
          maxR: stageW * 0.58,
          alpha: 0.85,
          col: "#f43f5e"
        });
      }
    }

    if (elapsed >= LOADER_START) {
      if (!loaderShown) {
        loaderShown = true;
        if (loaderWrap) loaderWrap.classList.add("rb-loader-active");
      }
      const loadDur = INTRO_DURATION - LOADER_START - 350;
      const rawP = Math.max(0, Math.min(1, (elapsed - LOADER_START) / loadDur));
      const stagedP = Math.min(1, rawP + 0.04 * Math.sin(rawP * Math.PI * 4));
      const pct = Math.round(stagedP * 100);
      if (loaderFill) loaderFill.style.width = `${pct}%`;

      if (loaderNodes && loaderNodes.length) {
        loaderNodes.forEach((node, idx) => {
          const threshold = ((idx + 1) / loaderNodes.length) * 95;
          node.classList.toggle("on", pct >= threshold);
        });
      }

      if (rawP < 0.98 && now - lastTickTime > 140) {
        sfxLoaderTick(rawP);
        lastTickTime = now;
      }

      if (Math.random() < 0.045) {
        shockwaves.push({
          x: W * 0.5,
          y: H * 0.44,
          r: 85,
          maxR: 165,
          alpha: 0.42,
          col: Math.random() > 0.5 ? "#00f0ff" : "#f43f5e"
        });
      }

      if (rawP >= 0.99 && !readyChimePlayed) {
        readyChimePlayed = true;
        sfxLoaderReady();
      }
    }

    if (shipVisible && Math.random() < 0.8) {
      for (const ox of [-14, 14]) {
        smokePuffs.push({
          x: shipX + ox + (Math.random() - 0.5) * 6,
          y: shipY - 56,
          vx: (Math.random() - 0.5) * 1.4,
          vy: -(2.6 + Math.random() * 2.2),
          r: 5 + Math.random() * 6,
          alpha: 0.48
        });
      }
    }

    for (let i = smokePuffs.length - 1; i >= 0; i--) {
      const sp = smokePuffs[i];
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.r += 0.35;
      sp.alpha -= 0.024;
      if (sp.alpha <= 0) {
        smokePuffs.splice(i, 1);
        continue;
      }
      ctx.fillStyle = `rgba(148, 163, 184, ${sp.alpha})`;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = missiles.length - 1; i >= 0; i--) {
      const ms = missiles[i];
      const dx = ms.targetX - ms.x;
      ms.vx += dx * 0.0045;
      ms.vx *= 0.96;
      ms.vy += 0.38;
      ms.x += ms.vx;
      ms.y += ms.vy;
      ms.trail.push({ x: ms.x, y: ms.y });
      if (ms.trail.length > 12) ms.trail.shift();

      if (ms.trail.length > 1) {
        ctx.strokeStyle = ms.col;
        ctx.lineWidth = 2.6;
        ctx.globalAlpha = 0.68;
        ctx.beginPath();
        ctx.moveTo(ms.trail[0].x, ms.trail[0].y);
        for (let k = 1; k < ms.trail.length; k++) {
          ctx.lineTo(ms.trail[k].x, ms.trail[k].y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(ms.x, ms.y, 3.8, 0, Math.PI * 2);
      ctx.fill();

      if (ms.y > H + 40) missiles.splice(i, 1);
    }

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;

      if (b.y > H * 0.7 && Math.random() < 0.07) {
        for (let p = 0; p < 3; p++) {
          particles.push({
            x: b.x,
            y: b.y,
            vx: (Math.random() - 0.5) * 6.5,
            vy: (Math.random() - 0.5) * 6.5,
            r: 1.8 + Math.random() * 2.3,
            life: 0.9,
            decay: 0.09,
            col: b.col
          });
        }
      }

      if (b.y > H + 50 || b.x < -50 || b.x > W + 50) {
        bullets.splice(i, 1);
        continue;
      }

      const ang = Math.atan2(b.vy, b.vx);
      const tx = b.x - Math.cos(ang) * b.len;
      const ty = b.y - Math.sin(ang) * b.len;

      ctx.strokeStyle = b.col;
      ctx.lineWidth = b.w * 2.1;
      ctx.lineCap = "round";
      ctx.globalAlpha = 0.46;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      ctx.strokeStyle = b.core;
      ctx.lineWidth = b.w * 0.85;
      ctx.globalAlpha = 0.98;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.r += (sw.maxR - sw.r) * 0.12;
      sw.alpha -= 0.028;
      if (sw.alpha <= 0) {
        shockwaves.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = sw.alpha;
      ctx.strokeStyle = sw.col;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    if (shipVisible) {
      draw3dShip(shipX, shipY, shipScale, shipBank, now);
    }

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
})();
</script>
<!-- RB_OPENING_INTRO_END -->
