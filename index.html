/* REDBOUND — Offline Edition stylesheet (tema neon gelap, mobile-first) */

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #05060f;
  color: #fff;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#overlay-root { position: absolute; inset: 0; pointer-events: none; }
#overlay-root > * { pointer-events: auto; }

/* ---------- overlay dasar ---------- */
.ovl {
  position: absolute;
  inset: 0;
  z-index: 10;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 16px;
  background: linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,.42) 40%, rgba(0,0,0,.82));
}
.ovl-center { display: flex; flex-direction: column; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); }
@media (min-width: 640px) { .ovl { padding: 24px; } }

.wrap { margin: auto; width: 100%; max-width: 56rem; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 0; }
.wrap-tight { max-width: 48rem; gap: 18px; padding: 12px 0; }

.center { text-align: center; }
.tagline { display: block; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5em; color: rgba(103,232,249,.8); }
.gametitle { font-size: clamp(34px, 9vw, 68px); font-weight: 900; letter-spacing: -.02em; line-height: 1.05; }
.gametitle .pink { color: #f472b6; }
.desc { margin-top: 12px; max-width: 28rem; margin-left: auto; margin-right: auto; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.6); }
@media (max-width: 639px) { .desc { display: none; } }

.cyan { color: #22d3ee; } .pink { color: #f472b6; } .violet { color: #a78bfa; } .lime { color: #a3e635; }
.red { color: #f87171; } .purple { color: #c084fc; } .orange { color: #fb923c; } .sky { color: #7dd3fc; }
.yellow { color: #facc15; } .fuchsia { color: #e879f9; } .dim { color: rgba(255,255,255,.3); }

/* ---------- judul neon ---------- */
.neon-title { text-shadow: 0 0 8px rgba(34,211,238,.9), 0 0 24px rgba(34,211,238,.55), 0 0 64px rgba(34,211,238,.35); animation: neon-pulse 2.6s ease-in-out infinite; }
.neon-title-pink { text-shadow: 0 0 8px rgba(244,114,182,.9), 0 0 24px rgba(255,61,127,.55), 0 0 64px rgba(255,61,127,.4); }
.neon-title-lime { text-shadow: 0 0 8px rgba(163,230,53,.9), 0 0 24px rgba(163,230,53,.5), 0 0 64px rgba(163,230,53,.35); }
@keyframes neon-pulse {
  0%, 100% { text-shadow: 0 0 8px rgba(34,211,238,.9), 0 0 24px rgba(34,211,238,.55), 0 0 64px rgba(34,211,238,.35); }
  50% { text-shadow: 0 0 10px rgba(34,211,238,1), 0 0 30px rgba(34,211,238,.7), 0 0 80px rgba(34,211,238,.45); }
}

/* ---------- chip & badge ---------- */
.badges { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; border: 1px solid; padding: 6px 14px; font-size: 12px; }
.chip-sm { padding: 3px 9px; font-size: 10px; border-radius: 9999px; }
.chip-yellow { border-color: rgba(250,204,21,.3); background: rgba(250,204,21,.1); color: #facc15; }
.chip-fuchsia { border-color: rgba(232,121,249,.3); background: rgba(232,121,249,.1); color: #e879f9; }
.chip-lime { border-color: rgba(163,230,53,.3); background: rgba(163,230,53,.1); color: #a3e635; }

/* ---------- tombol mode ---------- */
.modes { display: flex; width: 100%; flex-direction: column; gap: 12px; }
@media (min-width: 640px) { .modes { flex-direction: row; align-items: stretch; gap: 16px; } }
.mode-btn {
  --c: #22d3ee;
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 2px solid color-mix(in srgb, var(--c) 40%, transparent);
  border-radius: 16px; background: rgba(0,0,0,.45); padding: 16px; text-align: center;
  color: #fff; cursor: pointer; box-shadow: 0 0 22px color-mix(in srgb, var(--c) 13%, transparent);
  transition: transform .12s ease, filter .12s ease; font: inherit;
}
.mode-btn:hover { transform: scale(1.03); }
.mode-btn:active { transform: scale(.97); }
.mode-ic { display: flex; height: 48px; width: 48px; align-items: center; justify-content: center; border-radius: 16px; font-size: 24px; background: color-mix(in srgb, var(--c) 12%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 27%, transparent); }
.mode-tt { font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: .18em; color: var(--c); }
@media (min-width: 640px) { .mode-tt { font-size: 18px; } }
.mode-ds { font-size: 11px; line-height: 1.4; color: rgba(255,255,255,.7); }
@media (min-width: 640px) { .mode-ds { font-size: 12px; } }

  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(110, 231, 183, 0.85);
}

.buyname {
  margin: 0;
  font-size: 18px;
  font-weight: 900;
  color: #fff;
}

.buyline {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.7;
  color: rgba(255, 255, 255, 0.65);
}

.buyline b {
  color: #6ee7b7;
}

.buyrow {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.buyrow .buybtn {
  flex: 1;
  padding: 11px 0;
  border-radius: 12px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  cursor: pointer;
}
.labrow .buybtn {
  flex: 0 0 auto;
  width: auto;
  min-width: 70px;
  padding: 7px 12px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  text-align: center;
}
.lab-ds {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  line-height: 1.35;
}

.buybtn.ok {
  border: 1px solid rgba(52, 211, 153, 0.6);
  background: rgba(52, 211, 153, 0.2);
  color: #a7f3d0;
}

.buybtn.ok:hover {
  background: rgba(52, 211, 153, 0.35);
}

.buybtn.no {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.6);
}

.buybtn.no:hover {
  background: rgba(255, 255, 255, 0.1);
}

@keyframes corepop {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.25);
  }
  100% {
    transform: scale(1);
  }
}

.core-pop {
  animation: corepop 0.45s ease;
}

/* ================= PHASE 5 — DEPOT ================= */

.depot-card {
  width: 100%;
  max-width: 46rem;
  max-height: 94vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border: 1px solid rgba(252, 211, 77, 0.35);
  border-radius: 24px;
  background: rgba(10, 14, 34, 0.96);
  padding: 18px 14px;
  box-shadow: 0 0 40px rgba(251, 191, 36, 0.12);
}
@media (min-width: 640px) {
  .depot-card { padding: 22px 20px; }
}
.depot-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.depot-title {
  margin: 0;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.25em;
  color: #fcd34d;
  text-shadow: 0 0 18px rgba(251, 191, 36, 0.55);
}
.depot-visit {
  border: 1px solid rgba(252, 211, 77, 0.4);
  background: rgba(251, 191, 36, 0.1);
  color: #fde68a;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 700;
}
.depot-wallet {
  margin-left: auto;
  border: 1px solid rgba(252, 211, 77, 0.4);
  background: rgba(251, 191, 36, 0.15);
  color: #fcd34d;
  border-radius: 10px;
  padding: 4px 10px;
  font-size: 14px;
  font-weight: 900;
  white-space: nowrap;
}
.depot-feed {
  display: flex;
  flex-direction: column;
  gap: 2px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  padding: 6px 10px;
}
.depot-feed-row { margin: 0; font-size: 10px; color: rgba(255, 255, 255, 0.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.depot-feed-who { color: rgba(255, 255, 255, 0.85); }
.depot-feed-what { color: #fcd34d; }
.depot-feed-cost { color: #fda4af; }
.depot-grid { display: grid; gap: 8px; width: 100%; }
@media (min-width: 640px) {
  .depot-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
}
.depot-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 2px solid color-mix(in srgb, var(--c, #94a3b8) 33%, transparent);
  border-radius: 12px;
  background: rgba(10, 14, 34, 0.9);
  padding: 10px;
  min-width: 0;
}
.depot-item.sold { border-color: rgba(255, 255, 255, 0.1); opacity: 0.45; }
.depot-price { margin-left: auto; flex-shrink: 0; font-size: 11px; font-weight: 900; color: #fcd34d; }
.depot-eff { font-size: 10px; line-height: 1.35; color: rgba(253, 230, 138, 0.85); }
.depot-minus { font-size: 10px; line-height: 1.35; font-weight: 600; color: #f472b6; }
.depot-sold { text-align: center; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255, 255, 255, 0.35); }
.depot-row { display: flex; gap: 6px; width: 100%; }
.depot-buy { flex: 1; border-color: rgba(251, 191, 36, 0.5); background: rgba(251, 191, 36, 0.18); color: #fde68a; font-size: 11px; padding: 8px 10px; letter-spacing: 0.08em; }
.depot-buy:hover { background: rgba(251, 191, 36, 0.3); }
.depot-buy.off { border-color: rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.3); pointer-events: none; }
.depot-lock {
  width: 36px;
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  color: rgba(255, 255, 255, 0.5);
}
.depot-lock.on { border-color: rgba(103, 232, 249, 0.6); background: rgba(34, 211, 238, 0.2); }
.depot-foot { display: flex; gap: 8px; width: 100%; }
.depot-reroll { flex-shrink: 0; width: auto; }
.depot-foot .btn-lime { flex: 1; }

/* =============================================================
   REDBOUND PRO COMMAND SHELL & MULTI-PAGE UI (restyle tampilan)
   — hanya presentasi: alur, fitur & aturan sistem tidak berubah
   ============================================================= */
:root {
  --bg-glass: rgba(8, 12, 28, 0.82);
  --bg-card: rgba(12, 18, 40, 0.78);
  --bg-card-hover: rgba(18, 27, 58, 0.9);
  --border-subtle: rgba(148, 163, 184, 0.16);
  --border-cyan: rgba(34, 211, 238, 0.45);
  --accent-cyan: #22d3ee;
  --accent-pink: #f472b6;
  --accent-violet: #a78bfa;
  --accent-lime: #a3e635;
  --accent-gold: #facc15;
}

#menu.ovl {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.pro-shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  max-width: 1440px;
  margin: 0 auto;
  overflow: hidden;
  position: relative;
}

/* --- Top Command Header (Clean 2-Tier Mobile / 1-Tier Desktop) --- */
.pro-topbar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(5, 8, 20, 0.92);
  border-bottom: 1px solid rgba(34, 211, 238, 0.22);
  backdrop-filter: blur(16px);
  z-index: 30;
  flex-shrink: 0;
}
@media (min-width: 860px) {
  .pro-topbar {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    gap: 16px;
  }
}

.pro-topbar-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
}
@media (min-width: 860px) {
  .pro-topbar-main {
    width: auto;
    justify-content: flex-start;
    gap: 16px;
  }
}

.pro-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.pro-logo-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(244,114,182,0.22), rgba(34,211,238,0.22));
  border: 1px solid rgba(34,211,238,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #67e8f9;
  box-shadow: 0 0 16px rgba(34,211,238,0.25);
  flex-shrink: 0;
}
@media (min-width: 768px) {
  .pro-logo-mark { width: 38px; height: 38px; font-size: 18px; }
}
.pro-brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.pro-brand-title {
  font-size: clamp(17px, 4.2vw, 22px);
  font-weight: 900;
  letter-spacing: 0.06em;
  line-height: 1.05;
  color: #fff;
}
.pro-brand-title .pink { color: #f472b6; }
/* pil versi kecil di samping judul — JANGAN di subjudul (subjudul sempit, bikin numpuk ke dock) */
.pro-brand-ver {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.08em;
  color: rgba(148, 163, 184, 0.9);
  background: rgba(148, 163, 184, 0.14);
  border: 1px solid rgba(148, 163, 184, 0.32);
  border-radius: 6px;
  padding: 2px 4px;
  margin-left: 5px;
  vertical-align: 4px;
  white-space: nowrap;
}
@media (max-width: 359px) {
  .pro-brand-ver { display: none; }
}
.pro-brand-sub {
  font-size: 7.6px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: rgba(103, 232, 249, 0.78);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pro-topbar-sub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding-top: 7px;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
}
@media (min-width: 860px) {
  .pro-topbar-sub {
    width: auto;
    flex: 1;
    padding-top: 0;
    border-top: 0;
    justify-content: space-between;
    margin-left: 12px;
  }
}

.pro-pilot-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 10.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.85);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 55vw;
  transition: border-color 0.15s, background 0.15s;
}
@media (min-width: 640px) {
  .pro-pilot-pill { padding: 5px 12px; font-size: 11px; max-width: none; }
}
.pro-pilot-pill:hover {
  border-color: rgba(34, 211, 238, 0.5);
  background: rgba(34, 211, 238, 0.08);
}

.pro-TopBadges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  margin-left: auto;
}
.pro-TopBadges .chip {
  padding: 4px 10px;
  font-size: 11px;
  white-space: nowrap;
}

.pro-ctrl-dock {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.1);
  flex-shrink: 0;
}
.pro-ctrl-dock .iconbtn {
  width: 32px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.82);
  transition: all 0.14s ease;
}
@media (min-width: 640px) {
  .pro-ctrl-dock .iconbtn { width: 34px; height: 32px; }
}
.pro-ctrl-dock .iconbtn:hover {
  background: rgba(34, 211, 238, 0.14);
  border-color: rgba(34, 211, 238, 0.4);
  color: #67e8f9;
}
.pro-ctrl-dock .iconbtn.off {
  color: rgba(255, 255, 255, 0.28);
}
.pro-ctrl-dock .iconbtn.langbtn {
  width: auto;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
}

/* --- Main Body (Sidebar + Page Content) --- */
.pro-body {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  flex-direction: column;
}
@media (min-width: 860px) {
  .pro-body { flex-direction: row; }
}

/* --- Sidebar / Navigation Bar --- */
/* Mobile: strip menu 1 BARIS horizontal — menggeser DI DALAM nav saja;
   body position:fixed overflow:hidden, jadi halaman tetap tidak pernah melebar */
.pro-nav {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 6px;
  padding: 8px 10px;
  background: rgba(6, 9, 22, 0.86);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.pro-nav::-webkit-scrollbar { display: none; }

@media (min-width: 860px) {
  .pro-nav {
    display: flex;
    flex-direction: column;
    width: 230px;
    padding: 16px 12px;
    border-bottom: 0;
    border-right: 1px solid rgba(255, 255, 255, 0.09);
    overflow-y: auto;
    overflow-x: hidden;
    gap: 6px;
  }
}

.pro-nav-group-lbl {
  display: none;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: rgba(148, 163, 184, 0.5);
  padding: 10px 10px 4px;
}
@media (min-width: 860px) {
  .pro-nav-group-lbl { display: block; }
}

.pro-nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(226, 232, 240, 0.65);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.16s ease;
  position: relative;
  flex: 0 0 auto;
  width: auto;
  min-width: 0;
}
@media (min-width: 860px) {
  .pro-nav-btn {
    width: 100%;
    gap: 10px;
    padding: 11px 14px;
    font-size: 12.5px;
  }
}
.pro-nav-btn:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}
.pro-nav-btn.active {
  background: linear-gradient(90deg, rgba(34, 211, 238, 0.18), rgba(34, 211, 238, 0.04));
  border-color: rgba(34, 211, 238, 0.45);
  color: #67e8f9;
  box-shadow: 0 0 20px rgba(34, 211, 238, 0.14);
}
.pro-nav-ic {
  font-size: 16px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
}
.pro-nav-badge {
  margin-left: auto;
  font-size: 9px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.75);
}
.pro-nav-btn.active .pro-nav-badge {
  background: rgba(34, 211, 238, 0.24);
  color: #a5f3fc;
}
.pro-nav-badge:empty { display: none; }

.pro-nav-footer {
  display: none;
  margin-top: auto;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 10px;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.45);
}
@media (min-width: 860px) {
  .pro-nav-footer { display: block; }
}

/* --- Page Viewport & Pages --- */
.pro-viewport {
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden; /* pengaman: konten halaman tak boleh menggeser halaman */
  overscroll-behavior: contain;
  padding: 16px;
}
@media (min-width: 768px) {
  .pro-viewport { padding: 24px 28px 36px; }
}

.pro-page {
  display: none;
  flex-direction: column;
  gap: 20px;
  max-width: 1120px;
  margin: 0 auto;
  animation: pageFadeIn 0.2s ease-out;
}
.pro-page.active {
  display: flex;
}
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Page Section Headers --- */
.page-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.page-banner-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.page-kicker {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.28em;
  color: #22d3ee;
}
.page-title {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 900;
  letter-spacing: 0.02em;
  color: #fff;
}
.page-subtitle {
  font-size: 12.5px;
  color: rgba(226, 232, 240, 0.65);
  max-width: 46rem;
  line-height: 1.5;
}

/* --- Command Deck / Hero Holobay (Page 1) --- */
.deck-top-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}
@media (min-width: 960px) {
  .deck-top-grid {
    grid-template-columns: 340px minmax(0, 1fr);
    align-items: stretch;
  }
}

.holo-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  padding: 16px;
  border-radius: 18px;
  background: linear-gradient(165deg, rgba(12, 20, 44, 0.88), rgba(6, 10, 24, 0.94));
  border: 1px solid rgba(34, 211, 238, 0.3);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 0 28px rgba(34, 211, 238, 0.06);
  position: relative;
  overflow: hidden;
}
.holo-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.holo-tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #67e8f9;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(34, 211, 238, 0.12);
  border: 1px solid rgba(34, 211, 238, 0.3);
}
.holo-stage {
  position: relative;
  width: 100%;
  height: 150px;
  border-radius: 14px;
  background: radial-gradient(circle at center, rgba(34, 211, 238, 0.12) 0%, rgba(5, 6, 15, 0.85) 75%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#holoCanvas {
  width: 100%;
  height: 100%;
  display: block;
}
.holo-pilot-meta {
  position: absolute;
  bottom: 8px;
  left: 10px;
  right: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
  font-size: 10px;
}
.holo-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.holo-stat-box {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.07);
  border-radius: 9px;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.holo-stat-box span {
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255, 255, 255, 0.45);
}
.holo-stat-box b {
  font-size: 12px;
  color: #fff;
}
.holo-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
}
.holo-link-btn {
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.85);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.holo-link-btn:hover {
  border-color: rgba(34, 211, 238, 0.5);
  color: #67e8f9;
  background: rgba(34, 211, 238, 0.1);
}

/* --- Hangar Inspector --- */
.hangar-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
}
@media (min-width: 980px) {
  .hangar-layout {
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    align-items: start;
  }
}

.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.fpill {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.04);
  color: rgba(255, 255, 255, 0.65);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.fpill:hover {
  border-color: rgba(255, 255, 255, 0.3);
  color: #fff;
}

  justify-content: center;

  height: 146px;

  pointer-events: none;
}

  to { transform: rotate(360deg); }
}

  position: absolute;
  border-radius: 50%;
  border: 2px solid #22d3ee;
  animation: mmPulse 2.2s ease-out infinite;
  pointer-events: none;
}

  100% { width: 150px; height: 150px; opacity: 0; }

  function startGoogleLogin() {
    H?.audio?.click();
    alertBox.className = "l-alert mono";
    if (!window.RedboundNet || !window.RedboundNet.signInWithGoogle) {
      showLoginMsg(h("⚠ Cloud module not ready — reload the page.", "⚠ Modul cloud belum siap — muat ulang halaman."), "err");
      return;
    }
    showLoginMsg(h("☁ Opening Google account picker…", "☁ Membuka pemilih akun Google…"), "ok");
    window.RedboundNet.signInWithGoogle().then((r) => {
      if (r && r.ok) return; // browser di-redirect ke Google → account picker muncul
      if (r && r.error === "google-not-enabled") {
        showLoginMsg(h("⚠ Google login not enabled yet. Setup once: Supabase Dashboard → Authentication → Providers → Google (see supabase/GOOGLE_SETUP.txt).", "⚠ Login Google belum diaktifkan. Setup sekali: Supabase Dashboard → Authentication → Providers → Google (lihat supabase/GOOGLE_SETUP.txt)."), "err");
      } else if (r && r.error === "offline") {
        showLoginMsg(h("⚠ No internet connection.", "⚠ Tidak ada koneksi internet."), "err");
      } else {
        showLoginMsg(h("⚠ " + ((r && r.error) || "Google login failed"), "⚠ " + ((r && r.error) || "Login Google gagal")), "err");
      }
    }).catch(() => showLoginMsg(h("⚠ Google login failed.", "⚠ Login Google gagal."), "err"));

      loginId: cleanLoginId,
      pwdHash: pwdVal ? rbHash(pwdVal) : (currentPilotSession?.pwdHash || ""),
      isGuest: !cleanEmail && !pwdVal,
      ship: shipId,
      registeredAt: cleanEmail ? new Date().toISOString() : null
    });
    if (cloudData) {
      window.RedboundNet?.applyCloudSnapshot(cloudData, false);
    } else {
      let nextChars = f.chars.includes(shipId) ? f.chars : [...f.chars, shipId];

      f = { ...f, chars: nextChars, sel: shipId, cores: f.cores + bonusCores };
    }

    window.RedboundNet?.subscribeSessionVault(currentPilotSession);

    syncCloudReadyPayload(cleanEmail ? "email_authenticated" : "guest_login");
    H?.audio?.init();

    if (H?.audio?.musicEnabled) H.audio.startMusic("menu");
    ovl.style.display = "none";
    if (cloudData) {
      Ht(h(`☁ Cloud Account Restored: ${cleanName} (${F(f.cores)} ⬡ · ${F(f.trophies)} 🏆)`, `☁ Akun Cloud Dipulihkan: ${cleanName} (${F(f.cores)} ⬡ · ${F(f.trophies)} 🏆)`));
    } else if (grantBonus) {
      Ht(h(`✨ Welcome ${cleanName}! +100 ⬡ Email Registration Bonus added!`, `✨ Selamat datang ${cleanName}! Bonus +100 ⬡ Pendaftaran Email diterima!`));

      Ht(h(`✓ Pilot ${cleanName} authenticated!`, `✓ Akses Pilot ${cleanName} diterima!`));
    }
    Q();
  };

function claimDailySupply() {
  let today = Qs();
  if (f.lastSupply === today) {
    Ht(h("⏳ Daily Supply already claimed today — come back tomorrow!", "⏳ Suplai Harian sudah diklaim hari ini — kembali besok!"));
    return;
  }
  f = { ...f, cores: f.cores + 25, lastSupply: today };
  J(f);
  H?.audio?.levelup();
  Ht(h("🎁 Daily Supply Claimed: +25 ⬡ Neon Cores!", "🎁 Suplai Harian Diklaim: +25 ⬡ Inti Neon!"));
  Q();
}

function refundAllLab() {
  let totalRefund = 0;
  for (let upg of qs) {
    let lv = f.levels[upg.id] ?? 0;
    for (let i = 0; i < lv; i++) totalRefund += upg.cost[i] ?? 0;
  }
  if (totalRefund <= 0) {
    Ht(h("No Permanent Lab upgrades to refund yet.", "Belum ada level Lab Permanen untuk di-reset."));
    return;
  }
  f = { ...f, cores: f.cores + totalRefund, levels: {} };
  J(f);
  H?.audio?.levelup();
  Ht(h(`↺ Lab Reset! +${F(totalRefund)} ⬡ refunded in full.`, `↺ Lab Di-reset! +${F(totalRefund)} ⬡ dikembalikan 100%.`));
  Q();
}

function recruitPilotWithCores(pilot) {
  if (f.chars.includes(pilot.id)) return;
  let spec = PILOT_UNLOCK_SPEC[pilot.id] || { reqTrophy: 100, cost: 250 };
  let trpOk = (f.trophies || 0) >= spec.reqTrophy;
  let msnOk = !pilot.unlock || (f.missionCleared || []).includes(pilot.id);
  if (!trpOk || !msnOk) {
    H?.audio?.hurt();
    let msg = !trpOk
      ? h(`🔒 Trophy Gate Locked: Need ${F(spec.reqTrophy)} 🏆 (You have ${F(f.trophies||0)} 🏆).`, `🔒 Gembok Trophy: Butuh ${F(spec.reqTrophy)} 🏆 (Saat ini ${F(f.trophies||0)} 🏆).`)
      : h(`🔒 Mission Gate Locked: ${v(pilot.unlock.hint)}`, `🔒 Syarat Misi Belum Tuntas: ${v(pilot.unlock.hint)}`);
    Ht(msg);
    return;
  }
  if (f.cores < spec.cost) {
    H?.audio?.hurt();
    Ht(h(`⚠ Need ${F(spec.cost)} ⬡ Neon Cores to purchase ${pilot.name} license.`, `⚠ Butuh ${F(spec.cost)} ⬡ Inti Neon untuk menebus lisensi kapal ${pilot.name}.`));
    return;
  }
  f = { ...f, cores: f.cores - spec.cost, chars: [...f.chars, pilot.id], sel: pilot.id };
  J(f);
  H?.audio?.levelup();
  Ht(h(`✓ ${pilot.name} License Activated! (-${F(spec.cost)} ⬡)`, `✓ Lisensi Kapal ${pilot.name} Aktif! (-${F(spec.cost)} ⬡)`));
  Q();
}

  amb.addColorStop(0, auraCol + "48");
  amb.addColorStop(0.55, auraCol + "1a");
  amb.addColorStop(1, "transparent");
  ctx.fillStyle = amb;
  ctx.beginPath();
  ctx.arc(0, 0, R * 2.55, 0, Math.PI * 2);
  ctx.fill();

  // 2) Determine Exact 3D Hue (matches Beranda 100%)
  let hueDeg = 0;
  if (customSkinCol) {
    hueDeg = __rbHexToHueShift(customSkinCol);
  } else if (charId && __rbPilotHueMap[charId] !== undefined) {
    hueDeg = __rbPilotHueMap[charId];
  } else if (col) {
    hueDeg = __rbHexToHueShift(col);
  }

  let sprite3d = __rbGet3dShipCanvas(hueDeg);
  let w3d = R * 3.55;
  let h3d = R * 4.22;

  // 3) Twin Roaring Plasma Afterburner Plumes at the 3D Engine Nozzles
  let flicker = 0.82 + 0.34 * Math.sin(cSec * 36);
  let plumeLen = R * 1.32 * flicker;
  for (let side of [-1, 1]) {
    let ex = side * w3d * 0.1245;
    let ey = h3d * 0.255;
    let fg = ctx.createLinearGradient(ex, ey, ex, ey + plumeLen);
    fg.addColorStop(0, "#ffffff");
    fg.addColorStop(0.38, fCol);
    fg.addColorStop(1, "transparent");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(ex - R * 0.19, ey);
    ctx.lineTo(ex, ey + plumeLen);
    ctx.lineTo(ex + R * 0.19, ey);
    ctx.closePath();
    ctx.fill();
  }

  // 4) Render the Photorealistic 3D Starfighter Sprite (Centered on Spine & Nose)
  if (sprite3d) {
    ctx.drawImage(sprite3d, -w3d * 0.5257, -h3d * 0.50, w3d, h3d);
  } else {
    // Instant fallback only while Image decodes on frame 0
    ctx.beginPath();
    ctx.moveTo(0, -R * 1.42);
    ctx.lineTo(R * 0.44, -R * 0.42);
    ctx.lineTo(R * 1.14, R * 0.56);
    ctx.lineTo(0, R * 0.74);
    ctx.lineTo(-R * 1.14, R * 0.56);
    ctx.lineTo(-R * 0.44, -R * 0.42);
    ctx.closePath();
    ctx.fillStyle = col || "#22d3ee";
    ctx.fill();
  }

  ctx.restore();
}

function mqttEncodeLen(len) {
  let enc = [];
  do {
    let d = len % 128;
    len = Math.floor(len / 128);
    if (len > 0) d |= 0x80;
    enc.push(d);
  } while (len > 0);
  return new Uint8Array(enc);
}

function mqttMakeConnect(cid) {
  let proto = new TextEncoder().encode("MQTT");
  let cidB = new TextEncoder().encode(cid);
  let vh = [0, proto.length, ...proto, 4, 0x02, 0, 45];
  let pl = [0, cidB.length, ...cidB];
  let remLen = vh.length + pl.length;
  let lenBytes = mqttEncodeLen(remLen);
  let out = new Uint8Array(1 + lenBytes.length + remLen);
  out[0] = 0x10;
  out.set(lenBytes, 1);
  out.set(vh, 1 + lenBytes.length);
  out.set(pl, 1 + lenBytes.length + vh.length);
  return out.buffer;
}

function mqttMakeSubscribe(packetId, topic) {
  let topB = new TextEncoder().encode(topic);
  let vh = [(packetId >> 8) & 0xff, packetId & 0xff];
  let pl = [(topB.length >> 8) & 0xff, topB.length & 0xff, ...topB, 0];
  let remLen = vh.length + pl.length;
  let lenBytes = mqttEncodeLen(remLen);
  let out = new Uint8Array(1 + lenBytes.length + remLen);
  out[0] = 0x82;
  out.set(lenBytes, 1);
  out.set(vh, 1 + lenBytes.length);
  out.set(pl, 1 + lenBytes.length + vh.length);
  return out.buffer;
}

function rbHash(str) {
  let s = String(str || "").trim().toLowerCase();
  let h1 = 0xdeadbeef ^ s.length, h2 = 0x41c6ce57 ^ s.length;
  for (let i = 0, ch; i < s.length; i++) {
    ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");
}

function mqttMakePublish(topic, jsonStr, retain = false) {
  let topB = new TextEncoder().encode(topic);
  let payB = new TextEncoder().encode(jsonStr);
  let vh = [(topB.length >> 8) & 0xff, topB.length & 0xff, ...topB];
  let remLen = vh.length + payB.length;

  out.set(vh, 1 + lenBytes.length);
  out.set(payB, 1 + lenBytes.length + vh.length);

    let mySkin = ri(f);
    let skinObj = mySkin.id === "default" ? undefined : { shape: mySkin.shape, color: mySkin.color };
    let effectVal = f.effect !== "none" ? f.effect : undefined;
    let trailCol = Ne.find(a => a.id === f.trail)?.color || "";
    return {
      name: cName,
      charId: pDef.id,
      skin: skinObj,
      effect: effectVal,
      trail: trailCol,
      meta: f.levels ? { ...f.levels } : {},
      trophies: f.trophies || 0
    };
  }

  connect() {
    if (this.getOpenSockets().length > 0) {
      return Promise.resolve();
    }
    return new Promise((resolve) => {
      this.connectWaiters.push(resolve);
      if (this.connecting) return;
      this.connecting = true;

      // === ONLINE OPTIMIZATION v2.1.6.5 ===
      // Single-broker with sequential fallback. Previously connected to all 3 brokers
      // in parallel which tripled bandwidth, caused packet duplication, and overloaded
      // public broker rate-limits — the #1 cause of severe online lag.
      let brokers = [
        "wss://broker.emqx.io:8084/mqtt",
        "wss://broker.hivemq.com:8884/mqtt",
        "wss://test.mosquitto.org:8081/mqtt"
      ];

      let resolvedOnce = false;
      let flushWaiters = () => {
        if (resolvedOnce) return;
        resolvedOnce = true;
        this.connecting = false;
        let list = this.connectWaiters.splice(0);
        for (let fn of list) {
          try { fn(); } catch {}
        }
      };

      // Try brokers ONE AT A TIME. Stop at the first that succeeds.
      let brokerIdx = 0;
      let attachSocket = (url, idx) => {
        let s = new WebSocket(url, ["mqtt"]);
        s.binaryType = "arraybuffer";
        s._mqttReady = false;
        s._subs = new Set();
        s._brokerUrl = url;
        this.sockets.push(s);

        let settled = false;
        let to = setTimeout(() => {
          if (settled) return;
          settled = true;
          try { s.close(); } catch {}
          // timed out — try next broker
          brokerIdx++;
          if (brokerIdx < brokers.length) {
            attachSocket(brokers[brokerIdx], brokerIdx);
          } else {
            this.connecting = false;
            flushWaiters();
          }
        }, 3500);

        s.onopen = () => {
          try {
            s.send(mqttMakeConnect(this.clientId + "_" + idx));
          } catch {
            if (!settled) {
              settled = true;
              clearTimeout(to);
              brokerIdx++;
              if (brokerIdx < brokers.length) {
                attachSocket(brokers[brokerIdx], brokerIdx);
              } else {
                this.connecting = false;
                flushWaiters();
              }
            }
          }
        };

        s.onmessage = (ev) => {
          let buf = new Uint8Array(ev.data);
          if (!buf || buf.length < 2) return;
          let offset = 0;
          while (offset < buf.length) {
            let pktType = buf[offset] & 0xf0;
            let mult = 1, remLen = 0, i = offset + 1;
            while (i < buf.length) {
              let d = buf[i++];
              remLen += (d & 127) * mult;
              mult *= 128;
              if ((d & 128) === 0) break;
            }
            let pktEnd = i + remLen;
            if (pktType === 0x20) { // CONNACK
              s._mqttReady = true;
              if (!settled) {
                settled = true;
                clearTimeout(to);
              }
              this.startKeepAlive();
              for (let t of this.activeTopics) {
                this.sendSubToSocket(s, t);
              }
              flushWaiters();
            } else if (pktType === 0x30 && pktEnd <= buf.length) { // PUBLISH
              let topLen = (buf[i] << 8) | buf[i + 1];
              let topStart = i + 2;
              let payStart = topStart + topLen;
              if (payStart <= pktEnd) {
                let topic = new TextDecoder().decode(buf.slice(topStart, payStart));
                let payloadStr = new TextDecoder().decode(buf.slice(payStart, pktEnd));
                try {
                  let msg = JSON.parse(payloadStr);
                  if (msg && msg.type === "game_event" && (msg.evt === "msnap" || msg.evt === "snap")) {
                    if (!this._burstQueue) this._burstQueue = {};
                    this._burstQueue[msg.evt] = { msg, topic };
                  } else {
                    this.handleInbound(msg, topic);
                  }
                } catch {}
              }
            }
            offset = pktEnd;
            if (remLen < 0 || offset <= 0) break;
          }
          if (this._burstQueue) {
            let q = this._burstQueue;
            this._burstQueue = null;
            if (q.snap) this.handleInbound(q.snap.msg, q.snap.topic);
            if (q.msnap) this.handleInbound(q.msnap.msg, q.msnap.topic);
          }
        };

        s.onerror = () => {
          if (!settled) {
            settled = true;
            clearTimeout(to);
            brokerIdx++;
            if (brokerIdx < brokers.length) {
              attachSocket(brokers[brokerIdx], brokerIdx);
            } else {
              this.connecting = false;
              flushWaiters();
            }
          }
        };

        s.onclose = () => {
          s._mqttReady = false;
          this.sockets = this.sockets.filter(x => x !== s);
          if (!settled) {
            settled = true;
            clearTimeout(to);
            brokerIdx++;
            if (brokerIdx < brokers.length) {
              attachSocket(brokers[brokerIdx], brokerIdx);
            } else {
              this.connecting = false;
              flushWaiters();
            }
          } else if (this.status !== "idle") {
            // === ONLINE OPTIMIZATION v2.1.6.6 ===
            // Auto-reconnect when socket drops DURING active game/lobby.
            // Previously: only the 12s keep-alive timer would catch this, by which
            // time the guest's snapWatchdog had already hit 10s and shown "LINK LOST".
            // Now: immediately attempt reconnection (with 500ms backoff to avoid hammering).
            this.connecting = false;
            if (this._reconnectTimer) clearTimeout(this._reconnectTimer);
            this._reconnectTimer = setTimeout(() => {
              this._reconnectTimer = null;
              if (this.status !== "idle" && this.getOpenSockets().length === 0 && !this.connecting) {
                this.connect().then(() => {
                  // Re-subscribe to active room topics on the new socket.
                  // activeTopics are preserved across reconnects, and the new
                  // socket's onopen handler will subscribe to all of them.
                  if (this.roomCode) {
                    this.subRoomTopics(this.roomCode);
                  }
                });
              }
            }, 500);
          }
        };
      };
      // Kick off with the first broker
      attachSocket(brokers[0], 0);
    });
  }

  startKeepAlive() {
    if (this.pingTimer) return;
    this.pingTimer = setInterval(() => {
      let open = this.getOpenSockets();
      for (let s of open) {
        try { s.send(new Uint8Array([0xc0, 0x00]).buffer); } catch {}
      }
      if (this.status !== "idle" && open.length === 0 && !this.connecting) {
        this.connect();
      }
    }, 12000);
  }

  sendSubToSocket(s, topicFilter) {
    if (!s || !s._mqttReady || s.readyState !== 1) return;
    if (!s._subs) s._subs = new Set();
    if (s._subs.has(topicFilter)) return;
    s._subs.add(topicFilter);
    this.pktId = (this.pktId % 65000) + 1;
    try { s.send(mqttMakeSubscribe(this.pktId, topicFilter)); } catch {}
  }

  sendSubToSockets(topicFilter) {
    for (let s of this.getOpenSockets()) {
      this.sendSubToSocket(s, topicFilter);
    }
  }

  subRoomTopics(code) {
    if (!code) return;
    let topicFilter = `rb/v2/${code}/#`;
    this.activeTopics.add(topicFilter);
    this.sendSubToSockets(topicFilter);
  }

  publish(subTopic, obj, overrideRoom) {
    let targetRoom = overrideRoom || this.roomCode;
    if (!targetRoom) return;
    let fullTopic = `rb/v2/${targetRoom}/${subTopic}`;
    let seq = this.msgSeq++;
    let pid = this.clientId + "_" + seq;
    let jsonStr = JSON.stringify({ ...obj, _room: targetRoom, _sender: this.clientId, _pid: pid, _seq: seq });
    let open = this.getOpenSockets();
    if (open.length === 0 && !this.connecting) {
      this.connect();
    }
    let pkt = mqttMakePublish(fullTopic, jsonStr);
    for (let s of open) {
      try { s.send(pkt); } catch {}
    }
    if (this.bc) {
      try { this.bc.postMessage({ topic: fullTopic, payload: jsonStr }); } catch {}
    }
  }

  clearTimers() {
    if (this.searchTimer) { clearInterval(this.searchTimer); this.searchTimer = null; }
    if (this.seekInterval) { clearInterval(this.seekInterval); this.seekInterval = null; }
    if (this.hostHeartbeat) { clearInterval(this.hostHeartbeat); this.hostHeartbeat = null; }
    if (this.guestRetryTimer) { clearInterval(this.guestRetryTimer); this.guestRetryTimer = null; }
  }

  // --- 1. INVITE ROOM: HOST ---
  createInviteRoom(code, onStatus, fromQuickMatch = false) {
    this.clearTimers();
    if (!fromQuickMatch) this.pendingMatchInfo = null;
    this.onStatusCb = onStatus;
    this.roomCode = code.trim().toUpperCase();
    this.role = "host";
    this.status = "waiting_for_guest";
    if (!fromQuickMatch) {
      this.notifyStatus(h(`Room ${this.roomCode} active! Share code with friend. Waiting...`, `Room ${this.roomCode} aktif! Bagikan kode ke teman. Menunggu teman...`));
    }

    this.subRoomTopics(this.roomCode);
    this.connect().then(() => {
      if (this.status !== "waiting_for_guest") return;
      this.subRoomTopics(this.roomCode);
      let sendReady = () => {
        if (this.status === "waiting_for_guest" && this.role === "host") {
          this.ensureConnected();
          this.publish("host", {
            type: "host_ready",
            room: this.roomCode,
            pilot: this.getMyPilot()
          });
          // If this room was created via Co-op Duet Quick Match, also re-announce on LOBBY so partner never misses it
          if (this.pendingMatchInfo) {
            this.publish("match", this.pendingMatchInfo, "LOBBY");
          }
        }
      };
      sendReady();
      this.hostHeartbeat = setInterval(sendReady, 550);
    });
  }

  // --- 2. INVITE ROOM: GUEST ---
  joinRoom(code, onStatus, fromQuickMatch = false) {
    this.clearTimers();
    this.onStatusCb = onStatus;
    this.roomCode = code.trim().toUpperCase();
    this.role = "guest";
    this.status = "connecting_to_host";
    if (!fromQuickMatch) {
      this.notifyStatus(h(`Connecting to Room ${this.roomCode}...`, `Menghubungkan ke Room ${this.roomCode}...`));
    }

    this.subRoomTopics(this.roomCode);
    this.connect().then(() => {
      if (this.status !== "connecting_to_host") return;
      this.subRoomTopics(this.roomCode);
      let sendJoin = () => {
        if (this.status === "connecting_to_host" && this.role === "guest") {
          this.ensureConnected();
          this.publish("guest", {
            type: "guest_join",
            room: this.roomCode,
            pilot: this.getMyPilot()
          });
        }
      };
      sendJoin();
      let tries = 0;
      this.guestRetryTimer = setInterval(() => {
        if (this.status === "connecting_to_host") {
          tries++;
          sendJoin();
          if (tries === 10 && !fromQuickMatch) {
            this.notifyStatus(h(`Waiting for Host in Room ${this.roomCode}... Make sure your friend opened Online Lobby!`, `Menunggu Host di Room ${this.roomCode}... Pastikan teman membuka Lobi Online!`));
          }
        } else {
          clearInterval(this.guestRetryTimer);
        }
      }, 500);
    });
  }

  // --- 3. CO-OP DUET ONLINE QUICK MATCH (REAL USER MATCHMAKING) ---
  startQuickMatch(onStatus) {
    this.clearTimers();
    this.pendingMatchInfo = null;
    this.onStatusCb = onStatus;
    this.status = "quick_searching";
    this.role = null;
    this.roomCode = "LOBBY";
    this.searchSec = 0;
    this.notifyStatus(h("Scanning global frequency for a real partner... (0s)", "Memindai frekuensi global mencari pemain nyata... (0 dtk)"));

    this.searchTimer = setInterval(() => {
      this.searchSec++;
      if (this.status === "quick_searching") {
        this.notifyStatus(h(`Searching for online partner... (${this.searchSec}s)`, `Mencari pasangan online nyata... (${this.searchSec} dtk)`));
      }
    }, 1000);

    this.subRoomTopics("LOBBY");
    this.connect().then(() => {
      if (this.status !== "quick_searching") return;
      this.subRoomTopics("LOBBY");
      let sendSeek = () => {
        if (this.status === "quick_searching") {
          this.ensureConnected();
          this.publish("seek", {
            type: "qm_seek",
            cid: this.clientId,
            pilot: this.getMyPilot(),
            ts: Date.now()
          }, "LOBBY");
        }
      };
      sendSeek();
      this.seekInterval = setInterval(sendSeek, 600);
    });
  }

  transitionFromLobbyToPair(hostCid, guestCid, pairRoom, otherPilot) {
    if (this.status !== "quick_searching") return;
    let amHost = this.clientId === hostCid;
    this.notifyStatus(h(`⚡ Partner detected (${otherPilot.name})! Locking room ${pairRoom}...`, `⚡ Pasangan ditemukan (${otherPilot.name})! Mengunci room ${pairRoom}...`));
    if (amHost) {
      this.pendingMatchInfo = {
        type: "qm_match",
        hostCid,
        guestCid,
        room: pairRoom,
        fromCid: this.clientId,
        pilot: this.getMyPilot()
      };
      this.createInviteRoom(pairRoom, this.onStatusCb, true);
    } else {
      this.joinRoom(pairRoom, this.onStatusCb, true);
    }
  }

  handleInbound(msg, topic) {
    if (!msg || !msg.type) return;
    if (msg.type === "cloud_vault_save") {
      if (this._vaultWaiter) {
        this._vaultWaiter(msg);
        return;
      }
      if (msg._sender !== this.clientId && currentPilotSession) {
        let myKeys = this.getVaultKeysForSession(currentPilotSession);
        if (myKeys.some(k => topic && topic.includes(k))) {
          let localTs = Number(SafeStorage.getItem("neon-survivor:cloudTs") || 0);
          if ((msg.updatedAt || 0) > localTs) {
            this.applyCloudSnapshot(msg, false);
          }
        }
      }
      return;
    }
    if (msg._sender === this.clientId) return; // Ignore own echo

    // Deduplicate multi-broker messages & reject out-of-order stream packets from slower brokers
    if (msg._pid) {
      if (this.seenMsgIds.has(msg._pid)) return;
      this.seenMsgIds.add(msg._pid);
      if (this.seenMsgIds.size > 600) {
        let first = this.seenMsgIds.values().next().value;
        this.seenMsgIds.delete(first);
      }
    }
    if (msg.type === "game_event" && (msg.evt === "in" || msg.evt === "msnap" || msg.evt === "snap") && typeof msg._seq === "number") {
      if (!this.peerSeqMap) this.peerSeqMap = new Map();
      let streamKey = msg._sender + ":" + (msg.evt === "in" ? "in" : "snap");
      let lastSeq = this.peerSeqMap.get(streamKey) || 0;
      if (msg._seq <= lastSeq && msg.evt !== "snap") return; // Never let a slow broker's old msnap/in overwrite newer state
      if (msg._seq > lastSeq) this.peerSeqMap.set(streamKey, msg._seq);
    }

    // --- QUICK MATCH LOBBY PAIRING ---
    let isLobbyMsg = msg._room === "LOBBY" || (topic && topic.includes("/LOBBY/"));
    if (isLobbyMsg) {
      if (this.status === "quick_searching") {
        if (msg.type === "qm_seek" && msg.cid && msg.cid !== this.clientId) {
          let ids = [this.clientId, msg.cid].sort();
          let pairRoom = "QM-" + ids[0].slice(-4).toUpperCase() + ids[1].slice(-4).toUpperCase();
          this.publish("match", {
            type: "qm_match",
            hostCid: ids[0],
            guestCid: ids[1],
            room: pairRoom,
            fromCid: this.clientId,
            pilot: this.getMyPilot()
          }, "LOBBY");
          this.transitionFromLobbyToPair(ids[0], ids[1], pairRoom, msg.pilot);
          return;
        }
        if (msg.type === "qm_match" && (msg.hostCid === this.clientId || msg.guestCid === this.clientId)) {
          this.transitionFromLobbyToPair(msg.hostCid, msg.guestCid, msg.room, msg.pilot);
          return;
        }
      } else if (this.status === "waiting_for_guest" && this.pendingMatchInfo && msg.type === "qm_seek") {
        // Partner is still in LOBBY — re-send qm_match immediately
        if (msg.cid === this.pendingMatchInfo.guestCid) {
          this.publish("match", this.pendingMatchInfo, "LOBBY");
        }
        return;
      }
    }

    // Ensure room messages belong to our active roomCode
    if (msg._room && this.roomCode && msg._room !== this.roomCode) return;

    // --- ROOM HANDSHAKE: HOST SIDE ---
    if (this.role === "host" && msg.type === "guest_join") {
      if (this.status === "waiting_for_guest") {
        this.status = "paired";
        this.partner = msg.pilot;
        this.pendingMatchInfo = null;
        this.clearTimers();
        this.notifyStatus(h(`⚡ Friend connected: ${msg.pilot.name}! Launching battle...`, `⚡ Terhubung dengan ${msg.pilot.name}! Memulai pertempuran...`));

        let startPkt = {
          type: "game_start",
          room: this.roomCode,
          hostPilot: this.getMyPilot(),
          guestPilot: msg.pilot
        };
        this.lastStartPkt = startPkt;
        this.publish("host", startPkt);
        setTimeout(() => this.publish("host", startPkt), 120);
        setTimeout(() => this.publish("host", startPkt), 280);
        setTimeout(() => this.publish("host", startPkt), 480);

        if (this.onMatched) this.onMatched(msg.pilot, this.roomCode);
        setTimeout(() => {
          document.getElementById("matchmakingOverlay")?.remove();
          document.getElementById("onlineLobbyModal")?.remove();
          let myP = this.getMyPilot();
          H.startRun({
            charId: myP.charId,
            remotePilot: msg.pilot,
            meta: f.levels,
            unlocked: Array.from(new Set([...f.chars, ...(f.missionCleared || [])])),
            mode: "coop",
            trail: myP.trail,
            skin: myP.skin,
            effect: myP.effect,
            danger: It
          });
          H.pushBanner(`ONLINE SQUAD · ${this.roomCode}`, h(`partner: ${msg.pilot.name} — fight together!`, `mitra: ${msg.pilot.name} — berjuang bersama!`), "#22d3ee", 3.2);
        }, 320);
        return;
      } else if (this.status === "paired" && this.lastStartPkt) {
        // Guest missed earlier game_start burst — re-send immediately!
        this.publish("host", this.lastStartPkt);
        return;
      }
    }

    // --- ROOM HANDSHAKE: GUEST SIDE ---
    if (this.role === "guest" && this.status === "connecting_to_host") {
      if (msg.type === "host_ready") {
        this.publish("guest", {
          type: "guest_join",
          room: this.roomCode,
          pilot: this.getMyPilot()
        });
        return;
      }
      if (msg.type === "game_start") {
        this.status = "paired";
        this.partner = msg.hostPilot;
        this.clearTimers();
        this.notifyStatus(h(`⚡ Connected to ${msg.hostPilot.name}! Entering arena...`, `⚡ Terhubung ke ${msg.hostPilot.name}! Masuk ke arena...`));

        if (this.onMatched) this.onMatched(msg.hostPilot, this.roomCode);
        setTimeout(() => {
          document.getElementById("matchmakingOverlay")?.remove();
          document.getElementById("onlineLobbyModal")?.remove();
          H.startGuest(this.getMyPilot(), msg.hostPilot);
          H.pushBanner(`ONLINE SQUAD · ${this.roomCode}`, h(`partner: ${msg.hostPilot.name} — synced!`, `mitra: ${msg.hostPilot.name} — sinkronisasi aktif!`), "#34d399", 3.2);
        }, 250);
        return;
      }
    }

    // --- IN-GAME REAL-TIME EVENT ROUTING ---
    if (msg.type === "game_event" && this.status === "paired") {
      if (this.role === "guest" && msg.from === "host") {
        let evt = msg.evt, data = msg.data;
        if (evt === "snap" || evt === "msnap") H.guestSnapshot(data);
        else if (evt === "banner") H.guestBanner(data);
        else if (evt === "choice") H.guestChoice(data);
        else if (evt === "depot") H.guestDepot(data);
        else if (evt === "depotclose") H.guestDepotClose();
        else if (evt === "end") H.guestEnd(data.kind, data.stats);
        else if (evt === "paused") { data ? H.pause() : H.resume(); }
      } else if (this.role === "host" && msg.from === "guest") {
        let evt = msg.evt, data = msg.data;
        if (evt === "in") H.hostInput(data);
        else if (evt === "choice_pick") H.guestChoose(data.slot);
        else if (evt === "depot_act") H.guestDepotAct(data);
      }
    }
  }

  handleGameNetEvent(type, payload) {
    if (!this.roomCode || this.status !== "paired") return;
    this.publish(this.role, {
      type: "game_event",
      from: this.role,
      evt: type,
      data: payload
    });
  }

  notifyStatus(text) {
    if (this.onStatusCb) this.onStatusCb(text);
  }

  publishRetained(fullTopic, obj) {
    let seq = this.msgSeq++;
    let pid = this.clientId + "_v_" + seq;
    let jsonStr = JSON.stringify({ ...obj, _sender: this.clientId, _pid: pid, _seq: seq });
    let open = this.getOpenSockets();
    if (open.length === 0 && !this.connecting) {
      this.connect();
    }
    let pkt = mqttMakePublish(fullTopic, jsonStr, true);
    for (let s of open) {
      try { s.send(pkt); } catch {}
    }
    if (this.bc) {
      try { this.bc.postMessage({ topic: fullTopic, payload: jsonStr }); } catch {}
    }
  }

  getVaultKeysForSession(sess) {
    if (!sess) return [];
    let keys = new Set();
    if (sess.email) keys.add(rbHash(sess.email));
    if (sess.loginId) keys.add(rbHash(sess.loginId));
    if (sess.callsign && sess.callsign !== "OFFLINE-PILOT") keys.add(rbHash(sess.callsign));
    return Array.from(keys);
  }

  subscribeSessionVault(sess) {
    let keys = this.getVaultKeysForSession(sess || currentPilotSession);
    for (let k of keys) {
      let tf = `rb/v2/vault/${k}/save`;
      this.activeTopics.add(tf);
      this.sendSubToSockets(tf);
    }
  }

  pushCloudVault() {
    if (this._suppressCloudPush) return;
    let sess = currentPilotSession;
    if (!sess || (sess.isGuest && !sess.pwdHash && !sess.email)) return;
    let pwdHash = sess.pwdHash || "";
    if (!pwdHash) {
      let accs = loadAccounts();
      let rec = accs[(sess.email || "").toLowerCase()] || accs[(sess.callsign || "").toLowerCase()];
      if (rec && rec.code) {
        pwdHash = rbHash(rec.code);
        sess.pwdHash = pwdHash;
        saveSession(sess);
      }
    }
    let keys = this.getVaultKeysForSession(sess);
    if (keys.length === 0) return;
    this._cloudRev = (this._cloudRev || Number(SafeStorage.getItem("neon-survivor:cloudRev") || 0)) + 1;
    let nowTs = Date.now();
    SafeStorage.setItem("neon-survivor:cloudRev", String(this._cloudRev));
    SafeStorage.setItem("neon-survivor:cloudTs", String(nowTs));
    let snapshot = {
      type: "cloud_vault_save",
      rev: this._cloudRev,
      updatedAt: nowTs,
      callsign: sess.callsign || Dt || "PILOT",
      email: sess.email || "",
      pwdHash: pwdHash,
      meta: f,
      progress: G,
      best: we,
      danger: It
    };
    this.connect().then(() => {
      this.subscribeSessionVault(sess);
      for (let k of keys) {
        this.publishRetained(`rb/v2/vault/${k}/save`, snapshot);
      }
    });
  }

  pullCloudAccount(idVal, pwdVal, timeoutMs = 1500) {
    let cleanId = String(idVal || "").trim().toLowerCase();
    let inputPwdHash = rbHash(pwdVal);
    let keyHash = rbHash(cleanId);
    let topicFilter = `rb/v2/vault/${keyHash}/save`;
    return new Promise((resolve) => {
      let done = false;
      let finish = (res) => {
        if (done) return;
        done = true;
        this._vaultWaiter = null;
        resolve(res);
      };
      let timer = setTimeout(() => finish({ found: false }), timeoutMs);
      this._vaultWaiter = (msg) => {
        clearTimeout(timer);
        if (msg.pwdHash && msg.pwdHash !== inputPwdHash) {
          finish({ found: true, authError: true });
        } else {
          finish({ found: true, authError: false, data: msg });
        }
      };
      this.activeTopics.add(topicFilter);
      this.connect().then(() => {
        this.sendSubToSockets(topicFilter);
      });
    });
  }

  applyCloudSnapshot(snap, announce = false) {
    if (!snap || !snap.meta) return false;
    let localRev = Number(SafeStorage.getItem("neon-survivor:cloudRev") || 0);
    let localTs = Number(SafeStorage.getItem("neon-survivor:cloudTs") || 0);
    this._suppressCloudPush = true;
    try {
      let cm = snap.meta;
      let mergedChars = Array.from(new Set([...(f.chars || ["volt"]), ...(cm.chars || ["volt"])]));
      let mergedMc = Array.from(new Set([...(f.missionCleared || ["volt"]), ...(cm.missionCleared || ["volt"])]));
      let mergedSkins = Array.from(new Set([...(f.skins || []), ...(cm.skins || [])]));
      let mergedTrails = Array.from(new Set([...(f.trails || []), ...(cm.trails || [])]));
      let mergedEffects = Array.from(new Set([...(f.effects || []), ...(cm.effects || [])]));
      let mergedThemes = Array.from(new Set([...(f.themes || []), ...(cm.themes || [])]));
      let mergedLevels = { ...(f.levels || {}), ...(cm.levels || {}) };
      for (let k of Object.keys(mergedLevels)) {
        mergedLevels[k] = Math.max(f.levels?.[k] || 0, cm.levels?.[k] || 0);
      }
      // Use authoritative cores from whichever snapshot is newer (or higher if fresh browser)
      let useCloudCores = (snap.updatedAt || 0) >= localTs || (snap.rev || 0) >= localRev || (f.cores === 0 && (cm.cores || 0) > 0);
      let nextCores = useCloudCores ? (cm.cores ?? f.cores) : Math.max(f.cores || 0, cm.cores || 0);
      let nextTrophies = Math.max(f.trophies || 0, cm.trophies || 0);
      f = {
        ...f,
        ...cm,
        cores: nextCores,
        trophies: nextTrophies,
        chars: mergedChars,
        missionCleared: mergedMc,
        skins: mergedSkins,
        trails: mergedTrails,
        effects: mergedEffects,
        themes: mergedThemes,
        levels: mergedLevels,
        sel: cm.sel && mergedChars.includes(cm.sel) ? cm.sel : f.sel
      };
      SafeStorage.setItem(_s, JSON.stringify(f));
      if (snap.progress) {
        let cp = snap.progress;
        let mergedAch = Array.from(new Set([...(G?.ach || []), ...(cp.ach || [])]));
        let mergedCounters = { ...(G?.counters || {}), ...(cp.counters || {}) };
        for (let ck of Object.keys(mergedCounters)) {
          if (typeof mergedCounters[ck] === "number") {
            mergedCounters[ck] = Math.max(G?.counters?.[ck] || 0, cp.counters?.[ck] || 0);
          }
        }
        G = {
          ...(G || st()),
          ...cp,
          ach: mergedAch,
          counters: mergedCounters,
          shields: Math.max(G?.shields || 0, cp.shields || 0)
        };
        SafeStorage.setItem(Js, JSON.stringify(G));
        // FIX mission harian: pastikan SELALU ada 3 goal hari ini.
        // Jika snapshot cloud punya daily kosong (day≠hari ini atau goals=[]), at(st())
        // akan roll 3 mission baru. Jika cloud punya 3 goal valid hari ini → dipertahankan.
        try { G = at(st()); SafeStorage.setItem(Js, JSON.stringify(G)); } catch (e) {}
      }
      if (typeof snap.best === "number" && snap.best > we) {
        we = snap.best;
        SafeStorage.setItem(Lt, String(we));
      }
      this._cloudRev = Math.max(localRev, snap.rev || 1);
      SafeStorage.setItem("neon-survivor:cloudRev", String(this._cloudRev));
      SafeStorage.setItem("neon-survivor:cloudTs", String(Math.max(localTs, snap.updatedAt || Date.now())));
      Q();
      if (announce) {
        Ht(h(`☁ Cloud Sync Complete! (${F(f.cores)} ⬡ · ${F(f.trophies)} 🏆)`, `☁ Sinkronisasi Cloud Berhasil! (${F(f.cores)} ⬡ · ${F(f.trophies)} 🏆)`));
      }
    } finally {
      this._suppressCloudPush = false;
    }
    return true;
  }

  cancel() {
    this.clearTimers();
    this.pendingMatchInfo = null;
    this.status = "idle";
    this.role = null;
    this.onMatched = null;
  }
}

<script>
/* REDBOUND UX PATCH v3 — pemulihan arena & tombol kembali (DOM-only) */
(function(){
  var BK="neon-survivor:autoBattle", LK="neon-survivor:session", LG="neon-survivor:lang-v2";
  function lang(){ try{ var v=localStorage.getItem(LG); return v==="id"?"id":"en"; }catch(e){ return "en"; } }
  function tr(en,id){ return lang()==="id"?id:en; }
  function rbToast(msg){
    try{
      var t=document.createElement("div");
      t.style.cssText="position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:2147483646;background:rgba(11,14,29,.92);border:1px solid rgba(34,211,238,.4);color:#a5f3fc;font:700 11px ui-monospace,Menlo,monospace;padding:8px 14px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.5);white-space:nowrap";
      t.textContent=msg;document.body.appendChild(t);
      setTimeout(function(){t.style.transition="opacity .5s";t.style.opacity="0";},2400);
      setTimeout(function(){t.remove();},3000);
    }catch(e){}
  }
  // ---- 1) Setelah refresh: kembali masuk ke arena tempur (run dimulai ulang di arena yang sama) ----
  try{
    var isRoom=/[?&]room=/.test(location.search);
    var sess=null; try{ sess=JSON.parse(localStorage.getItem(LK)||"null"); }catch(e){}
    var lovl=document.getElementById("loginOvl");
    var loginVisible=!!(lovl&&lovl.style.display!=="none");
    var raw=null; try{ raw=localStorage.getItem(BK); }catch(e){}
    if(!isRoom&&sess&&!loginVisible&&raw){
      var inf=null; try{ inf=JSON.parse(raw); }catch(e){}
      try{ localStorage.removeItem(BK); }catch(e){}
      if(inf&&(inf.mode==="timed"||inf.mode==="mission")&&(Date.now()-(inf.at||0))<30*60*1000){
        setTimeout(function(){
          try{
            var want=inf.mode==="timed"?"Time Attack":"Mission";
            var rows=document.querySelectorAll(".seg-tabs"),modeRow=null;
            for(var i=0;i<rows.length&&!modeRow;i++){
              var bs=rows[i].querySelectorAll("button");
              for(var j=0;j<bs.length;j++){ if(bs[j].textContent.trim()==="Time Attack"){ modeRow=rows[i]; break; } }
            }
            if(!modeRow)return;
            var mbtn=null,bs2=modeRow.querySelectorAll("button");
            for(var k=0;k<bs2.length;k++){ if(bs2[k].textContent.trim()===want){ mbtn=bs2[k]; break; } }
            if(!mbtn)return;
            mbtn.click();
            setTimeout(function(){
              try{
                var all=document.querySelectorAll("button"),lb=null;
                for(var m=0;m<all.length;m++){ var tt=all[m].textContent.trim(); if(tt==="START BATTLE"||tt==="MULAI TEMPUR"){ lb=all[m]; break; } }
                if(lb){ lb.click(); rbToast(tr("\u27F3 Reloaded \u2014 back in the arena!","\u27F3 Dimuat ulang \u2014 kembali ke arena tempur!")); }
              }catch(e){}
            },90);
          }catch(e){}
        },400);
      }
    }
  }catch(e){}
  // ---- 2) Tombol kembali -> dialog konfirmasi keluar; back 2x saat dialog terbuka = keluar ----
  var dlg=null,exiting=false;
  function ensureDlg(){
    if(dlg&&dlg.isConnected)return dlg;
    dlg=document.createElement("div");
    dlg.id="rbExitOvl";
    dlg.style.cssText="position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;display:none;align-items:center;justify-content:center;background:rgba(2,3,12,.84)";
    dlg.innerHTML='<div style="max-width:330px;width:88%;background:#0b0e1d;border:1px solid rgba(34,211,238,.35);border-radius:14px;padding:18px 16px;text-align:center;font-family:ui-monospace,Menlo,monospace;box-shadow:0 0 44px rgba(34,211,238,.15)">'
      +'<div style="font-weight:900;letter-spacing:1px;color:#e2e8f0;font-size:15px;margin-bottom:7px">'+tr("\u27F5 EXIT REDBOUND?","\u27F5 KELUAR DARI REDBOUND?")+'</div>'
      +'<div style="color:#94a3b8;font-size:11.5px;line-height:1.5;margin-bottom:15px">'+tr("Your progress is saved automatically to the cloud.","Progresmu tersimpan otomatis di cloud.")+'</div>'
      +'<div style="display:flex;gap:10px;justify-content:center">'
      +'<button id="rbExitNo" style="flex:1;padding:10px 6px;border-radius:10px;border:1px solid #334155;background:#111827;color:#e2e8f0;font-weight:800;font-size:12px;font-family:inherit;cursor:pointer">'+tr("STAY","BATAL")+'</button>'
      +'<button id="rbExitYes" style="flex:1;padding:10px 6px;border-radius:10px;border:1px solid rgba(239,68,68,.55);background:#2a0d12;color:#fca5a5;font-weight:800;font-size:12px;font-family:inherit;cursor:pointer">'+tr("EXIT APP","KELUAR")+'</button>'
      +'</div></div>';
    document.body.appendChild(dlg);
    dlg.querySelector("#rbExitNo").addEventListener("click",function(ev){ev.stopPropagation();dlg.style.display="none";});
    dlg.querySelector("#rbExitYes").addEventListener("click",function(ev){ev.stopPropagation();confirmExit();});
    return dlg;
  }
  function showDlg(){ensureDlg().style.display="flex";}
  function dlgOpen(){return !!(dlg&&dlg.isConnected&&dlg.style.display!=="none");}
  function confirmExit(){
    if(dlgOpen())dlg.style.display="none";
    exiting=true;
    try{if(window.RedboundApp&&typeof window.RedboundApp.exit==="function"){window.RedboundApp.exit();return;}}catch(e){}
    try{window.close();}catch(e){}
    setTimeout(function(){try{history.back();}catch(e){}},80);
    setTimeout(function(){
      if(exiting&&!document.hidden){
        exiting=false;
        rbToast(tr("You can close this tab now.","Silakan tutup tab/jendela ini."));
      }
    },600);
  }
  // Hook utk cangkang APK baru (MainActivity memanggil window.__rbAndroidBack())
  window.__rbAndroidBack=function(){
    if(dlgOpen()){confirmExit();return "handled";}
    showDlg();return "handled";
  };
  // Trap history utk browser: back pertama -> dialog, back kedua -> keluar
  try{
    history.replaceState({rbTrap:1},"");
    history.pushState({rbTrap:2},"");
    window.addEventListener("popstate",function(){
      if(exiting)return;
      if(dlgOpen()){confirmExit();}
      else{
        showDlg();
        setTimeout(function(){try{history.pushState({rbTrap:2},"")}catch(e){}},0);
      }
    });
  }catch(e){}
})();
</script>

  function showToast(msg){
    try {
      var t = document.createElement("div");
      t.style.cssText = "position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2147483646;background:rgba(8,13,30,.96);border:1px solid rgba(34,211,238,.55);color:#a5f3fc;font:800 11.5px ui-monospace,Menlo,monospace;padding:9px 16px;border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.65);white-space:nowrap";

    card.innerHTML = ''

    ovl.appendChild(card);
    document.body.appendChild(ovl);

    var promptBtn = document.getElementById("rbApkModalPromptBtn");
    if (promptBtn) {
      promptBtn.addEventListener("click", function(){
